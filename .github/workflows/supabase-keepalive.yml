# Supabase 무료 플랜은 1주일 동안 사용이 없으면 프로젝트를 정지한다.
# 3일마다 interview_sessions에서 id 1건을 읽어 정지되지 않게 한다 (읽기만, 데이터 변경 없음).
name: Supabase keepalive

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: interview_sessions 1건 읽기
        env:
          SUPABASE_URL: https://vkazebkztmqutzwofgki.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_g5Q1G2rSNFhsMvwyGxUsOg_MxGT4Vk4
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 20 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/interview_sessions?select=id&limit=1")
          echo "HTTP $code"
          test "$code" = 200

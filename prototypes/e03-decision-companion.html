<title>My Decision Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Clear Finance, Quiet Intelligence.
   Layout: simulated desktop Chrome — fictional brokerage (left) + side panel (right).
   Panel reads as one document: key numbers → my criteria → then vs now → self-check → today's summary.
   Neutral surfaces, ink as the action colour, semantic colour only for state (up/down, beyond-criteria, within-criteria). */
:root{
  --page:#EEF0F3; --chrome:#E1E4E8; --chrome-hi:#F6F7F9; --chrome-ink:#3A3F47; --chrome-sub:#7A808A; --omni:#E9EBEE;
  --bg:#FFFFFF; --bg-2:#F6F7F9; --bg-3:#EEF0F3; --line:#ECEEF1; --line-2:#DFE2E6;
  --ink:#121418; --ink-2:#4A505A; --ink-3:#8A909A;
  --on-ink:#FFFFFF;
  --up:#E0464E; --down:#3568D4;
  --ok:#1E7A58; --ok-bg:#EAF5F0;
  --warn:#A8620A; --warn-mark:#E9A23B; --warn-bg:#FDF4E7;
  --muted-bg:#F1F2F4;
  --site-brand:#1F2D57;
  --f:-apple-system,BlinkMacSystemFont,"Inter","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --ease:cubic-bezier(.25,.8,.25,1);
  --panel-w:420px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0A0B0D; --chrome:#1B1D21; --chrome-hi:#24262B; --chrome-ink:#D9DCE1; --chrome-sub:#8B9099; --omni:#141518;
  --bg:#111215; --bg-2:#181A1E; --bg-3:#202227; --line:#22252A; --line-2:#2D3036;
  --ink:#F2F3F5; --ink-2:#B6BBC3; --ink-3:#7E848E; --on-ink:#111215;
  --up:#FF6B71; --down:#729CFF; --ok:#52C796; --ok-bg:#12261D; --warn:#F2B451; --warn-mark:#E9A23B; --warn-bg:#2A2112; --muted-bg:#1D1F23;
  --site-brand:#AFC0F2; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0A0B0D; --chrome:#1B1D21; --chrome-hi:#24262B; --chrome-ink:#D9DCE1; --chrome-sub:#8B9099; --omni:#141518;
  --bg:#111215; --bg-2:#181A1E; --bg-3:#202227; --line:#22252A; --line-2:#2D3036;
  --ink:#F2F3F5; --ink-2:#B6BBC3; --ink-3:#7E848E; --on-ink:#111215;
  --up:#FF6B71; --down:#729CFF; --ok:#52C796; --ok-bg:#12261D; --warn:#F2B451; --warn-mark:#E9A23B; --warn-bg:#2A2112; --muted-bg:#1D1F23;
  --site-brand:#AFC0F2; color-scheme:dark}

html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.up{color:var(--up)}.down{color:var(--down)}

.stage{min-height:100%;display:flex;flex-direction:column;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.simnote{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12px;color:var(--chrome-sub)}
.simnote b{color:var(--chrome-ink);font-weight:600}

/* ── Browser chrome ── */
.browser{flex:none;min-height:620px;height:calc(100dvh - 70px);max-height:1000px;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:var(--chrome);border:1px solid var(--chrome);box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.06)}
.tabstrip{display:flex;align-items:flex-end;gap:6px;padding:8px 10px 0;min-width:0}
.dots{display:flex;gap:7px;padding:0 8px 10px 4px;flex:none}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--chrome-sub);opacity:.35;display:block}
.tab{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--chrome-sub);padding:8px 14px;border-radius:9px 9px 0 0;min-width:0;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--chrome-hi);color:var(--chrome-ink)}
.tab .fav{width:13px;height:13px;border-radius:3px;background:var(--site-brand);flex:none}
.toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--chrome-hi);border-bottom:1px solid var(--chrome)}
.tbtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--chrome-sub);flex:none;position:relative}
.tbtn svg{width:16px;height:16px}
button.tbtn:hover{background:var(--chrome)}
.omni{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:30px;border-radius:999px;background:var(--omni);padding:0 14px;font-size:13px;color:var(--chrome-ink)}
.omni span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.omni .host{color:var(--chrome-sub)}
.omni svg{width:12px;height:12px;flex:none;color:var(--chrome-sub)}
.extbtn{color:var(--chrome-ink)}
.extbtn.on{background:var(--chrome)}
.extbtn .dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--chrome);display:grid;place-items:center;font-size:11px;color:var(--chrome-ink);flex:none}
.viewport{flex:1;min-height:0;display:flex;position:relative;background:var(--bg-2);overflow:hidden}

/* ── Fictional brokerage ── */
.site{flex:1;min-width:0;overflow:auto;container-type:inline-size}
.s-head{display:flex;align-items:center;gap:28px;padding:0 28px;height:56px;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.s-logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--site-brand);white-space:nowrap}
.s-logo i{width:20px;height:20px;border-radius:6px;background:var(--site-brand);display:block}
.s-logo small{font-weight:500;color:var(--ink-3);font-size:11px}
.s-nav{display:flex;gap:22px;font-size:14px;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.s-nav .on{color:var(--ink);font-weight:600}
.s-body{padding:28px;display:grid;gap:20px;max-width:1180px}
.s-sec{background:var(--bg);border-radius:14px}
.acct{padding:24px 28px;display:grid;gap:18px}
.acct .k{font-size:13px;color:var(--ink-3)}
.acct .total{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.acct .pl{font-size:15px;font-weight:600;margin-top:4px}
.acct-row{display:flex;flex-wrap:wrap;gap:12px 40px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.acct-row b{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-top:3px}
.acct-row .meta{margin-left:auto;align-self:end;font-size:12px}
.s-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
@container (max-width:980px){.s-grid{grid-template-columns:minmax(0,1fr)}}
.s-h{display:flex;justify-content:space-between;align-items:baseline;padding:22px 24px 10px}
.s-h h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.s-h span{font-size:12px;color:var(--ink-3)}
.hold{display:grid}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 24px;text-align:left;width:100%;transition:background .15s}
.hrow:hover{background:var(--bg-2)}
.hrow.sel{background:var(--bg-2)}
.hrow .nm{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.hrow .sub{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.hrow .r{text-align:right}
.hrow .ev{font-size:15px;font-weight:600}
.hrow .pc{font-size:12.5px;margin-top:3px;font-weight:500}
.tagline{font-size:11px;color:var(--ink-3);font-weight:500;border:1px solid var(--line-2);border-radius:5px;padding:0 5px}
.det{padding:22px 24px 24px;display:grid;gap:18px}
.det .nm{font-size:15px;font-weight:600}
.det .price{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.det .chg{font-size:13px;font-weight:500;margin-top:2px}
.schart{width:100%;max-width:560px;height:auto;display:block}
.pos{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;font-size:13.5px;padding-top:14px;border-top:1px solid var(--line)}
.pos div{display:flex;justify-content:space-between}
.pos .k{color:var(--ink-3)}
.pos .v{font-weight:600}
.order{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.order button{height:46px;border-radius:10px;font-weight:600;font-size:15px;color:#fff}
.order .b{background:var(--up)}.order .s{background:var(--down)}
.ordermsg{font-size:12.5px;color:var(--ink-3);min-height:16px}
.news{list-style:none;margin:0;padding:0 24px 18px;display:grid}
.news li{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:3px}
.news li span{font-size:14px;line-height:1.45}
.news .meta{font-size:12px;color:var(--ink-3)}

/* ── nudge + launcher ── */
.nudge{position:absolute;top:10px;right:12px;z-index:6;width:min(320px,calc(100% - 24px));background:var(--bg);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.10);padding:16px;display:grid;gap:12px;animation:fade .22s var(--ease)}
.nudge .who{font-size:12px;color:var(--ink-3)}
.nudge p{margin:0;font-size:14.5px;line-height:1.5;font-weight:500}
.nudge .row{display:flex;gap:8px;justify-content:flex-end}
.launcher{position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:5;padding:12px 8px;border-radius:10px 0 0 10px;background:var(--bg);border:1px solid var(--line-2);border-right:0;font-size:12px;font-weight:600;color:var(--ink-2);writing-mode:vertical-rl;letter-spacing:.08em;transition:color .15s,padding .2s var(--ease)}
.launcher:hover{color:var(--ink);padding-right:11px}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ── side panel ── */
.panel{flex:none;width:var(--panel-w);max-width:100%;margin-right:calc(-1 * var(--panel-w));opacity:0;visibility:hidden;
  transition:margin-right .3s var(--ease),opacity .2s,visibility 0s .3s;
  background:var(--bg);display:flex;flex-direction:column;min-height:0;position:relative;border-left:1px solid var(--line-2)}
.viewport.open .panel{margin-right:0;opacity:1;visibility:visible;transition:margin-right .3s var(--ease),opacity .2s}
.resize{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:4}
.resize:hover,.resize.drag{background:linear-gradient(90deg,transparent 3px,var(--line-2) 3px,var(--line-2) 5px,transparent 5px)}
.p-head{padding:14px 20px 0;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.p-top{display:flex;align-items:center;gap:8px}
.p-top .t{flex:1;min-width:0}
.p-top b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.p-top small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.ibtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);transition:background .15s,color .15s}
.ibtn:hover{background:var(--bg-2);color:var(--ink)}
.ibtn svg{width:16px;height:16px}
.tabs{display:flex;gap:22px}
.tabs button{padding:6px 0 11px;font-size:14px;color:var(--ink-3);font-weight:500;position:relative;transition:color .15s}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:1px}
.p-body{flex:1;overflow:auto;scroll-behavior:smooth}
.p-foot{border-top:1px solid var(--line);padding:10px 20px 12px;display:grid;gap:6px;background:var(--bg)}
.ask{display:flex;align-items:center;gap:6px;background:var(--bg-2);border-radius:10px;padding:3px 3px 3px 12px}
.ask input{flex:1;min-width:0;border:0;background:none;outline:none;height:34px;font-size:13.5px}
.ask input::placeholder{color:var(--ink-3)}
.ask button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--ink);color:var(--on-ink);transition:opacity .15s}
.ask button:disabled{opacity:.2;cursor:default}
.ask svg{width:15px;height:15px}
.disc{font-size:11px;color:var(--ink-3);line-height:1.5}

/* panel content blocks */
.blk{padding:22px 20px;border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:0}
.enter{animation:fade .28s var(--ease) both}
.eyebrow{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.h{font-size:17px;font-weight:700;letter-spacing:-.015em;margin:0;display:flex;align-items:baseline;gap:8px;text-wrap:balance}
.h .n{font-size:13px;color:var(--ink-3);font-weight:600}
.note{font-size:13px;line-height:1.6;color:var(--ink-2);margin:6px 0 0}
.ai{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.02em;border-bottom:1px dotted var(--ink-3);white-space:nowrap}
.src{font-size:11.5px;color:var(--ink-3);line-height:1.5}
.stack{display:grid;gap:14px;margin-top:16px}

/* hero */
.big{font-size:36px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:6px}
.subline{font-size:14px;color:var(--ink-2);margin-top:6px}
.state{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.state::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.state.warn{color:var(--warn)}.state.ok{color:var(--ok)}.state.none{color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:12px 0;text-align:left;display:grid;gap:3px;transition:background .15s}
.stat+.stat{border-left:1px solid var(--line);padding-left:12px}
button.stat:hover .v{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.stat .k{font-size:11.5px;color:var(--ink-3)}
.stat .v{font-size:15px;font-weight:600}
.stat .s{font-size:11.5px;color:var(--ink-3)}
.more{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-2);font-weight:500;margin-top:14px}
.more svg{width:14px;height:14px;transition:transform .25s var(--ease)}
.more[aria-expanded="true"] svg{transform:rotate(180deg)}
.coll{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.coll.open{grid-template-rows:1fr}
.coll>div{overflow:hidden;min-height:0}

/* gauge */
.gauge{padding-top:22px}
.g-bar{position:relative;height:8px;border-radius:4px;background:var(--bg-3);margin:22px 0 8px}
.g-bar .zone{position:absolute;left:0;top:0;bottom:0;width:var(--lim);border-radius:4px 0 0 4px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--warn-mark) 38%,transparent) 0 3px,transparent 3px 6px)}
.g-bar .lim{position:absolute;left:var(--lim);top:-6px;bottom:-6px;width:1.5px;background:var(--ink)}
.g-bar .lim span{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;white-space:nowrap}
.g-bar .zero{position:absolute;left:var(--z);top:0;bottom:0;width:1px;background:var(--ink-3);opacity:.5}
.g-bar .fill{position:absolute;top:0;bottom:0;left:var(--z);width:0;background:var(--ink-3);opacity:.35;border-radius:4px;transition:left .7s var(--ease),width .7s var(--ease)}
.g-bar .mk{position:absolute;top:50%;left:var(--z);width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--bg);border:3px solid var(--ink);transition:left .7s var(--ease)}
.g-bar.beyond .mk{border-color:var(--warn-mark)}.g-bar.beyond .fill{background:var(--warn-mark);opacity:.45}
.gauge.in .mk{left:var(--x)}.gauge.in .fill{left:var(--fl);width:var(--fw)}
.g-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3)}
.hchart{margin-top:18px}
.hchart svg{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair}
.readout{font-size:13px;line-height:1.55;color:var(--ink-2);min-height:42px;margin-top:8px}
.readout b{color:var(--ink);font-weight:600}
.evdot{cursor:pointer}

/* option rows */
.opts{display:grid;margin-top:14px;border-top:1px solid var(--line)}
.opt{display:grid;grid-template-columns:18px minmax(0,1fr);gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);text-align:left;font-size:14.5px;line-height:1.45;transition:background .15s}
.opt:hover{background:var(--bg-2)}
.opt .mk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);transition:border-color .15s,background .15s;display:grid;place-items:center}
.opt.multi .mk{border-radius:5px}
.opt .mk svg{width:11px;height:11px;opacity:0;color:var(--on-ink)}
.opt[aria-pressed="true"]{font-weight:600}
.opt[aria-pressed="true"] .mk{border-color:var(--ink);background:var(--ink)}
.opt[aria-pressed="true"] .mk svg{opacity:1}
.opt small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:400;margin-top:1px}
.chosen{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:10px;font-size:15px;font-weight:600}
.link{font-size:13px;color:var(--ink-3);font-weight:500;white-space:nowrap}
.link:hover{color:var(--ink)}

.btn{height:44px;border-radius:10px;padding:0 18px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s,background .15s}
.btn.pri{background:var(--ink);color:var(--on-ink)}
.btn.sec{background:var(--bg-2);color:var(--ink)}
.btn.sec:hover{background:var(--bg-3)}
.btn.full{width:100%}
.btn.sm{height:34px;font-size:13px;padding:0 12px;border-radius:8px}
.btn:disabled{opacity:.3;cursor:default}
.next{margin-top:20px}

/* list rows (record, board) */
.rows{display:grid;border-top:1px solid var(--line);margin-top:16px}
.row{border-bottom:1px solid var(--line)}
.row-h{display:grid;grid-template-columns:minmax(0,1fr) auto 14px;gap:10px;align-items:center;padding:13px 0;width:100%;text-align:left}
.row-h .k{font-size:12.5px;color:var(--ink-3)}
.row-h .v{font-size:15px;font-weight:600;margin-top:2px;line-height:1.4}
.row-h .meta{font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.45}
.chev{width:14px;height:14px;color:var(--ink-3);transition:transform .25s var(--ease)}
.row.open .chev{transform:rotate(180deg)}
.row .coll{grid-template-rows:0fr}
.row.open .coll{grid-template-rows:1fr}
.row-b{padding:0 0 16px;display:grid;gap:12px}
.quote{background:var(--bg-2);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.7;display:grid;gap:4px}
.quote .m{font-size:11.5px;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px}
.quote.old p{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.quote p{margin:0}
.seg{display:inline-flex;background:var(--bg-2);border-radius:8px;padding:2px;gap:2px}
.seg button{height:30px;padding:0 11px;border-radius:6px;font-size:12.5px;color:var(--ink-2);font-weight:500;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line-2)}
.st{font-size:12px;font-weight:600;white-space:nowrap}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.none{color:var(--ink-3)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
textarea,input[type=text]{width:100%;border:1px solid var(--line-2);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:14px;line-height:1.55;resize:vertical;outline:none;transition:border-color .15s}
textarea:focus,input[type=text]:focus{border-color:var(--ink)}
textarea::placeholder,input::placeholder{color:var(--ink-3)}

/* board */

  else if(cur==="rel")list=rel.length?rel.map(infoRow).join(""):`<div class="src" style="padding:14px 0">${h.record&&h.record.origin==="later"?"직접 적은 매수 이유와 어떤 정보가 연결되는지는 AI가 판단하지 않았어요. ‘새로 나온 정보’를 보고 직접 연결해 보세요.":"투자 근거와 직접 연결된 새 정보가 없어요."}</div>`;
  else list=h.unknowns.map((u,k)=>{const o=f.item==="u"+k,inL=f.manual.includes(u.t);return `<div class="row ${o?"open":""}"><button class="row-h" data-a="item" data-v="u${k}" aria-expanded="${o}"><span><div class="v" style="font-size:14.5px">${esc(u.t)}</div><div class="meta">${inL?"확인할 내용에 담김":"확인 전"}</div></span><span></span>${CHEV}</button>

  return `<div class="cats">${cats.map(c=>`<button class="cat" aria-pressed="${cur===c[0]}" data-a="cat" data-v="${c[0]}"><span class="c num"><i class="i-${c[0]}"></i>${c[2]}</span><span class="l">${c[1]}</span></button>`).join("")}</div>
   <div class="rows">${list}</div><div class="src" style="margin-top:10px">모든 정보는 프로토타입용 가상 예시 · ${ASOF}</div>`},
 weight(h,f){

   <div class="wbar ${cap!=null&&w1>cap?"over":""}" id="wbar"><span class="cur" style="width:${w0/mx*100}%"></span><span class="add" style="left:${w0/mx*100}%;width:${(w1-w0)/mx*100}%"></span>${cap!=null?`<span class="cap" style="left:${cap/mx*100}%"><span>내 상한 ${cap}%</span></span>`:""}</div>

 sort(h,f){

 check(h,f){
  const N=nodes(h,f);

   if(a!==undefined){const label=n.type==="text"?(a||"건너뜀"):n.type==="multi"?a.map(x=>(n.opts.find(o=>o[0]===x)||[0,x])[1]).join(", "):n.opts.find(o=>o[0]===a)[1];const ev=evidence(h,f,n);

   const tmp=f.tmp[n.id]||[];

    ${n.type==="text"?`<textarea rows="2" id="qt-${n.id}" style="margin-top:12px" placeholder="${esc(n.ph)}"></textarea><div class="actions" style="margin-top:8px"><button class="btn pri sm" data-a="qtext" data-v="${n.id}">확인</button><button class="btn sec sm" data-a="qskip" data-v="${n.id}">건너뛰기</button></div>`

     ${n.type==="multi"?`<button class="btn pri sm" style="margin-top:12px" data-a="qmulti" data-v="${n.id}" ${tmp.length?"":"disabled"}>선택 완료</button>`:""}`}</div>`}).join("")}</div>
   ${dialogDone(h,f)?`<div class="src" style="padding-top:12px;border-top:1px solid var(--line)">점검을 마쳤어요. 답은 위에서 언제든 수정할 수 있어요.</div>`:""}`},
 summary(h,f){
  const L=f.savedId?(S.records.find(r=>r.id===f.savedId)||{lines:[]}).lines.map(l=>[l[0],l[1],l[2]||""]):summaryLines(h,f);

    <div class="coll ${f.fbOpen?"open":""}"><div>${FB.map(x=>`<div class="lk"><p>${x[1]}</p><div class="scale">${[1,2,3,4,5].map(n=>`<button aria-pressed="${!!(rec.fb&&rec.fb[x[0]]===n)}" data-a="fbset" data-v="${x[0]}" data-x="${n}">${n}</button>`).join("")}</div><div class="scale-l"><span>전혀 아니다</span><span>매우 그렇다</span></div></div>`).join("")}</div></div>`}
  return `${lines}<div class="src" style="margin-top:8px">위 내용은 점검 답변을 바탕으로 정리했어요 <span class="ai">AI 정리</span></div>

   <div class="opts" style="margin-top:0">${DECS.map(d=>`<button class="opt" aria-pressed="${f.dec===d[0]}" data-a="dec" data-v="${d[0]}"><span class="mk">${TICK}</span><span>${d[1]}<small>${d[2]}</small></span></button>`).join("")}</div>
   <label class="lab" for="memo">메모 (선택)</label><textarea id="memo" rows="3" placeholder="예: 손실 기준은 넘었지만 성장 근거가 훼손됐는지 3분기 실적 원문을 읽고 다시 보겠다.">${esc(f.memo)}</textarea>
   <span class="lab">다시 살펴볼 시점 (선택)</span><div class="chips">${["1주 후","다음 실적 발표 후","한 달 후"].map(x=>`<button class="chip" aria-pressed="${f.revisit===x}" data-a="revisit" data-v="${x}">${x}</button>`).join("")}</div>

function render(){

  $("#pFoot").hidden=false;
  const h=H[S.sel],f=F(),L=sections(h,f);

function syncMemo(){const m=$("#memo");if(m)F().memo=m.value}
const ACT={
 sel(v){if(S.sel===v)return;S.sel=v;S.orderMsg="";S.openRec=null;renderSite();render();$("#pBody").scrollTop=0},
 order(v){S.orderMsg=`가상 화면이에요. ${v} 주문은 실행되지 않아요.`;renderSite()},
 open(){S.tab="check";setOpen(true)},close(){setOpen(false)},dismiss(){S.nudged[S.sel]=true;renderChrome()},
 restart(){S.flow[S.sel]=fresh();S.tab="check";render();$("#pBody").scrollTop=0},
 tab(v){syncMemo();S.tab=v;render();$("#pBody").scrollTop=0},
 hero(){const f=F();f.heroOpen=!f.heroOpen;if(f.heroOpen)f.gaugeAnim=true;render();if(f.heroOpen)scrollTo("hero")},
 goto(v){reveal(v)},
 concern(v){const f=F();f.concern=v;f.path.push("concern:"+v);if(v==="loss"){f.heroOpen=true;f.gaugeAnim=true}f.revealed=Math.max(1,Math.min(f.revealed,1));f.anim=sections(H[S.sel],f)[0];render();scrollTo(v==="loss"?"hero":sections(H[S.sel],f)[0])},
 reconcern(){const f=F();f.concern=null;f.anim="concern";render()},
 next(){syncMemo();const h=H[S.sel],f=F(),L=sections(h,f);if(f.revealed<L.length){f.revealed++;f.anim=L[f.revealed-1];render();scrollTo(L[f.revealed-1])}},
 skipcheck(){const h=H[S.sel],f=F(),L=sections(h,f);f.revealed=L.length;f.anim="summary";render();scrollTo("summary")},
 rec(v){const f=F(),i=f.recOpen.indexOf(v);i<0?f.recOpen.push(v):f.recOpen.splice(i,1);const row=event.target.closest(".row");row.classList.toggle("open",i<0);row.querySelector(".row-h").setAttribute("aria-expanded",String(i<0))},
 valid(v,x){const vv=(S.valid[S.sel]=S.valid[S.sel]||{});if(vv[v]===x)delete vv[v];else vv[v]=x;persist();render()},
 edit(v){F().editing=v;render();const t=$("#edit-"+v);if(t)t.focus()},editcancel(){F().editing=null;render()},
 editsave(v){const t=$("#edit-"+v).value.trim();if(t){(S.edits[S.sel]=S.edits[S.sel]||{})[v]={text:t,at:fmtD(NOW)};persist();toast("고친 내용을 저장했어요. 원문은 그대로 남아요")}F().editing=null;render()},
 past(){F().past=!F().past;render()},
 cat(v){const f=F();f.cat=v;f.item=null;render()},
 item(v){const f=F();f.item=f.item===v?null:v;const row=event.target.closest(".row"),list=row.parentElement;const was=row.classList.contains("open");list.querySelectorAll(".row.open").forEach(r=>r.classList.remove("open"));if(!was)row.classList.add("open")},
 addchk(v){const f=F(),t=H[S.sel].unknowns[+v].t,i=f.manual.indexOf(t);i<0?f.manual.push(t):f.manual.splice(i,1);render();toast(i<0?"확인할 내용에 담았어요":"확인할 내용에서 뺐어요")},
 sort(v,x){F().sort[v]=x;render()},
 qpick(v,x){const f=F();f.ans[v]=x;f.path.push(v+":"+x);afterAnswer(v)},
 qtoggle(v,x){const f=F(),t=f.tmp[v]=f.tmp[v]||[],i=t.indexOf(x);i<0?t.push(x):t.splice(i,1);render()},
 qmulti(v){const f=F(),t=f.tmp[v]||[];if(!t.length)return;f.ans[v]=t.slice();f.path.push(v+":"+t.join("+"));afterAnswer(v)},
 qtext(v){const el=$("#qt-"+v),t=el?el.value.trim():"";if(!t)return el&&el.focus();F().ans[v]=t;F().path.push(v+":text");afterAnswer(v)},
 qskip(v){F().ans[v]="";F().path.push(v+":skip");afterAnswer(v)},
 qedit(v){const h=H[S.sel],f=F(),N=nodes(h,f),i=N.findIndex(n=>n.id===v);N.slice(i).forEach(n=>{if(n.id!==v)delete f.ans[n.id]});
  if(Array.isArray(f.ans[v]))f.tmp[v]=f.ans[v].slice();delete f.ans[v];if(!f.savedId){const L=sections(h,f),ci=L.indexOf("check");if(f.revealed>ci+1)f.revealed=ci+1}render()},
 dec(v){syncMemo();F().dec=v;render()},revisit(v){syncMemo();const f=F();f.revisit=f.revisit===v?"":v;render()},
 save(){syncMemo();const h=H[S.sel],f=F();if(!f.dec||f.savedId)return;const d=new Date(),id="r"+Date.now().toString(36);
  S.records.push({id,stock:h.id,at:`2026-11-17T${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`,pct:+pctOf(h).toFixed(1),concern:f.concern||"none",decision:f.dec,memo:f.memo.trim(),revisit:f.revisit,
   lines:summaryLines(h,f),path:f.path.slice(),secs:Math.round((Date.now()-f.t0)/1000),fb:{}});
  f.savedId=id;persist();render();toast("판단 기록을 저장했어요")},
 fb(){F().fbOpen=!F().fbOpen;render()},
 fbset(v,x){const r=S.records.find(r=>r.id===F().savedId);if(r){r.fb=r.fb||{};r.fb[v]=+x;persist();render()}},
 filter(v){S.filter=v;render()},
 recopen(v){S.openRec=S.openRec===v?null:v;render()},
 reset(v,x,el){if(el.dataset.c!=="1"){el.dataset.c="1";el.textContent="한 번 더 누르면 초기화";return}
  S.records=SEED.slice();S.edits={};S.valid={};S.custom={};H.C.record=null;S.flow={};persist();renderSite();S.tab="check";render();toast("데모 데이터를 초기화했어요")},
 norec(v){const f=F();f.norec=v||null;if(v==="form"&&!f.setup)f.setup={reason:"",period:"",loss:-15,review:""};if(v==="view"){f.revealed=Math.max(f.revealed,1);f.anim=sections(H[S.sel],f)[0]}render();if(v)scrollTo(v==="form"?"setup":sections(H[S.sel],f)[0])},
 suPeriod(v){const s=F().setup;readSetup();s.period=s.period===v?"":v;render()},
 suNone(){const s=F().setup;readSetup();s.loss=s.loss==null?-15:null;render()},
 suSave(){readSetup();const h=H[S.sel],f=F(),s=f.setup;if(s.reason.trim().length<3)return;const map={"3개월 이내":[0,3],"3~12개월":[3,12],"1~2년":[12,24],"2년 이상":[24,999]};
  const rec={written:`${fmtD(NOW)} (매수 ${daysBetween(h.buyDate,NOW)}일 후)`,origin:"later",reasonKey:"내가 적은 매수 이유",reason:s.reason.trim(),reasonSum:s.reason.trim().length>20?s.reason.trim().slice(0,20)+"…":s.reason.trim(),
   period:s.period&&s.period!=="정하지 않음"?s.period:"",periodM:map[s.period]||null,lossLimit:s.loss,weightCap:null,review:s.review.trim(),reviewSum:s.review.trim()?(s.review.trim().length>18?s.review.trim().slice(0,18)+"…":s.review.trim()):"",extra:null,memo:""};
  h.record=rec;S.custom[h.id]=rec;persist();S.flow[h.id]=fresh();S.flow[h.id].anim="concern";renderSite();render();toast("기준을 저장했어요");$("#pBody").scrollTop=0}
};
function readSetup(){const s=F().setup;if(!s)return;const r=$("#su-r"),v=$("#su-v"),l=$("#suL");if(r)s.reason=r.value;if(v)s.review=v.value;if(l&&s.loss!=null)s.loss=+l.value}
function afterAnswer(v){const h=H[S.sel],f=F();f.tmp[v]=[];const N=nodes(h,f),nx=N.find(n=>f.ans[n.id]===undefined);if(nx)f.anim="q:"+nx.id;render();
  requestAnimationFrame(()=>{const el=document.querySelector(".qnow")||document.querySelector("#sec-check .next"),b=$("#pBody");if(el){const r=el.getBoundingClientRect(),br=b.getBoundingClientRect();if(r.bottom>br.bottom-20||r.top<br.top)b.scrollTop+=r.top-br.top-120}})}

let event=null;
document.addEventListener("click",e=>{
  if(e.target.closest("#extBtn"))return setOpen(!S.open);
  const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a;
  if(a==="ev")return showEv(t);
  if(ACT[a]){event=e;ACT[a](t.dataset.v,t.dataset.x,t);event=null}
});
document.addEventListener("keydown",e=>{const ev=e.target.closest&&e.target.closest(".evdot");if(ev&&(e.key==="Enter"||e.key===" ")){e.preventDefault();showEv(ev)}});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="memo"){F().memo=t.value;return}
  if(t.id==="askIn"){$("#askBtn").disabled=!t.value.trim();return}
  if(t.id==="su-r"){F().setup.reason=t.value;$("#suSave").disabled=t.value.trim().length<3;return}
  if(t.id==="su-v"){F().setup.review=t.value;return}
  if(t.id==="suL"){F().setup.loss=+t.value;$("#suLv").textContent=t.value+"%";return}
  if(t.id==="wslide"){const h=H[S.sel],f=F();f.wx=+t.value;const w0=weightOf(h),w1=(evalOf(h)+f.wx)/TOTAL*100,cap=h.record&&h.record.weightCap!=null?h.record.weightCap:null,mx=wMax(w1);
   $("#wx").textContent=won(f.wx)+"원";$("#wv").textContent=w1.toFixed(1)+"%";const bar=$("#wbar");bar.classList.toggle("over",cap!=null&&w1>cap);
   bar.querySelector(".cur").style.width=w0/mx*100+"%";const ad=bar.querySelector(".add");ad.style.left=w0/mx*100+"%";ad.style.width=(w1-w0)/mx*100+"%";const cp=bar.querySelector(".cap");if(cp)cp.style.left=cap/mx*100+"%";$("#wnote").innerHTML=wNote(w0,w1,cap)}
});
const onScrub=e=>{const s=e.target.closest&&e.target.closest("svg[data-hist]");if(s&&!e.target.closest(".evdot"))scrub(s,e.clientX)};
document.addEventListener("pointermove",onScrub);document.addEventListener("pointerdown",onScrub);

/* free questions: rule-based, never a buy/sell conclusion or price outlook */
$("#ask").addEventListener("submit",e=>{e.preventDefault();const inp=$("#askIn"),q=inp.value.trim();if(!q)return;inp.value="";$("#askBtn").disabled=true;
  const h=H[S.sel],f=F();let a,links=[];
  if(/팔|매도|사야|살까|사도|매수|손절|익절|오를|떨어|반등|전망|목표가|버텨|물타/.test(q)){a="이 질문에는 결론이나 가격 전망을 드리지 않아요. 결정은 직접 하시는 거예요. 대신 판단에 쓸 수 있는 내 기준과 정보를 바로 볼 수 있어요.";links=(h.record?[["record","내 기준 보기"]]:[]).concat([["board","달라진 정보 보기"],["hero","지금 위치 보기"]])}
  else if(/실적|매출|공시|이익|흑자/.test(q)){const it=h.info.filter(i=>i.area==="earnings");a=it.length?it.map(i=>`${esc(i.t)} <span class="src">(${esc(i.d)} · ${esc(i.src)}, 가상)</span>`).join("<br>"):"기록된 실적 정보가 없어요.";links=[["board","그때와 지금 비교"]]}
  else if(/비중|추가/.test(q)){a="비중 변화를 직접 계산해 볼 수 있어요. 권유가 아니라 계산이에요.";links=[["weight","비중 계산 열기"]]}
  else if(/기준|손실|허용/.test(q)){a=h.record&&h.record.lossLimit!=null?`직접 정한 손실 기준은 ${h.record.lossLimit}%이고, 지금은 ${sgn(pctOf(h))}%예요.`:"직접 정한 손실 기준이 없어요.";links=[["hero","위치 자세히"]].concat(h.record?[["record","내 기준 원문"]]:[])}
  else if(/의견|유튜브|채널|커뮤니티|사람들/.test(q)){a="바뀐 것이 사실인지 의견인지 직접 나눠 볼 수 있어요.";links=[["sort","사실과 의견 나눠 보기"]]}
  else{a="이 프로토타입은 준비된 가상 정보 안에서만 답할 수 있어요.";links=(h.record?[["record","내 기준"]]:[]).concat([["board","달라진 정보"],["weight","비중 계산"]])}
  if(!h.record&&f.norec!=="view")links=links.filter(l=>l[0]==="hero").concat([["norec","기준 정리하기"]]);
  f.qa.push({q:esc(q),a,links:links.filter(l=>l[0]!=="norec")});render();requestAnimationFrame(()=>{const b=$("#pBody");b.scrollTop=b.scrollHeight})});

/* resize */
(function(){const hd=$("#resize");let sx=0,sw=0,dr=false;
  const ap=w=>{S.panelW=Math.max(360,Math.min(600,w));document.documentElement.style.setProperty("--panel-w",S.panelW+"px")};ap(S.panelW);
  hd.addEventListener("pointerdown",e=>{dr=true;sx=e.clientX;sw=S.panelW;hd.classList.add("drag");hd.setPointerCapture(e.pointerId);$("#panel").style.transition="none"});
  hd.addEventListener("pointermove",e=>{if(dr)ap(sw+(sx-e.clientX))});
  const end=()=>{if(dr){dr=false;hd.classList.remove("drag");$("#panel").style.transition="";persist()}};hd.addEventListener("pointerup",end);hd.addEventListener("pointercancel",end)})();

renderSite();renderChrome();
})();
</script>

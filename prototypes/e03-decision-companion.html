<title>My Decision Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* Layout: simulated desktop Chrome — fictional brokerage WTS on the left, extension side panel on the right.
   Three visual layers inside the panel: ✎ 내가 쓴 기록 (serif, ink border) · ▦ 계좌/시장 데이터 (mono, source line) · ◇ AI 정리 (dashed slate, "추론" tag). */
:root{
  --page:#E3E6EB; --chrome:#D6DBE2; --chrome-hi:#F1F3F6; --chrome-ink:#363E4B; --chrome-sub:#677081; --omni:#E5E9EF;
  --site-bg:#F3F4F6; --site-card:#FFFFFF; --site-ink:#181D26; --site-sub:#667081; --site-line:#E2E5EA; --site-brand:#22336A; --site-hover:#F2F5F9; --site-sel:#EAF0FA;
  --up:#D6343C; --down:#2A62D2;
  --pn-bg:#F4F6F5; --pn-card:#FFFFFF; --pn-ink:#1B2725; --pn-sub:#5A6865; --pn-line:#D9E1DF; --pn-accent:#2D6960; --pn-accent-ink:#FFFFFF; --pn-accent-soft:#E2EEEB;
  --mine-bg:#FFFFFF; --mine-line:#2A2620; --mine-ink:#25221D; --mine-tag:#5B4E3A;
  --ai-bg:#ECF1F7; --ai-line:#93A9C2; --ai-ink:#2A3C55;
  --st-in:#2D6960; --st-in-bg:#E2EEEB; --st-diff:#83560F; --st-diff-bg:#F4EAD6; --st-check:#3A5476; --st-check-bg:#E4EBF4;
  --focus:#2D6960;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 10px 30px rgba(20,30,40,.10);
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-site:"Apple SD Gothic Neo","Malgun Gothic","IBM Plex Sans KR",system-ui,sans-serif;
  --f-mine:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --panel-w:400px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0F1215; --chrome:#1D2228; --chrome-hi:#2A3038; --chrome-ink:#D5DAE1; --chrome-sub:#8E97A4; --omni:#171B20;
  --site-bg:#14171C; --site-card:#1C2027; --site-ink:#E7EAEF; --site-sub:#929BA8; --site-line:#2C323B; --site-brand:#9DB2EE; --site-hover:#222832; --site-sel:#23304A;
  --up:#F0656B; --down:#6E9BF5;
  --pn-bg:#141A19; --pn-card:#1C2423; --pn-ink:#E3ECEA; --pn-sub:#97A7A3; --pn-line:#2E3A38; --pn-accent:#7DBDB1; --pn-accent-ink:#0E1715; --pn-accent-soft:#213431;
  --mine-bg:#201F1C; --mine-line:#CFC6B4; --mine-ink:#EEE7DA; --mine-tag:#C9B794;
  --ai-bg:#1B2431; --ai-line:#4F6684; --ai-ink:#C3D3E8;
  --st-in:#8CCABE; --st-in-bg:#1F3330; --st-diff:#E5BC75; --st-diff-bg:#352A17; --st-check:#A9C0E0; --st-check-bg:#1F2A3A;
  --focus:#7DBDB1; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0F1215; --chrome:#1D2228; --chrome-hi:#2A3038; --chrome-ink:#D5DAE1; --chrome-sub:#8E97A4; --omni:#171B20;
  --site-bg:#14171C; --site-card:#1C2027; --site-ink:#E7EAEF; --site-sub:#929BA8; --site-line:#2C323B; --site-brand:#9DB2EE; --site-hover:#222832; --site-sel:#23304A;
  --up:#F0656B; --down:#6E9BF5;
  --pn-bg:#141A19; --pn-card:#1C2423; --pn-ink:#E3ECEA; --pn-sub:#97A7A3; --pn-line:#2E3A38; --pn-accent:#7DBDB1; --pn-accent-ink:#0E1715; --pn-accent-soft:#213431;
  --mine-bg:#201F1C; --mine-line:#CFC6B4; --mine-ink:#EEE7DA; --mine-tag:#C9B794;
  --ai-bg:#1B2431; --ai-line:#4F6684; --ai-ink:#C3D3E8;
  --st-in:#8CCABE; --st-in-bg:#1F3330; --st-diff:#E5BC75; --st-diff-bg:#352A17; --st-check:#A9C0E0; --st-check-bg:#1F2A3A;
  --focus:#7DBDB1; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

html,body{height:100%}
body{background:var(--page);color:var(--site-ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.stage{min-height:100%;display:flex;flex-direction:column;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.simnote{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--chrome-sub)}
.simnote b{color:var(--chrome-ink);font-weight:600}
.simnote .pill{border:1px solid var(--chrome);border-radius:999px;padding:2px 8px;background:var(--chrome-hi)}

/* ── Browser chrome ── */
.browser{flex:1;min-height:640px;height:calc(100dvh - 70px);max-height:980px;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:var(--chrome);box-shadow:var(--shadow);border:1px solid var(--chrome)}
.tabstrip{display:flex;align-items:flex-end;gap:6px;padding:8px 10px 0;min-width:0}
.dots{display:flex;gap:7px;padding:0 8px 10px 4px;flex:none}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--chrome-sub);opacity:.45;display:block}
.tab{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--chrome-sub);padding:8px 14px;border-radius:9px 9px 0 0;min-width:0;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--chrome-hi);color:var(--chrome-ink)}
.tab .fav{width:14px;height:14px;border-radius:3px;background:var(--site-brand);flex:none;display:grid;place-items:center;color:var(--site-card);font-size:9px;font-weight:700}
.toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--chrome-hi);border-bottom:1px solid var(--chrome)}
.tbtn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--chrome-sub);flex:none;position:relative}
.tbtn:hover{background:var(--chrome)}
.tbtn svg{width:16px;height:16px}
.omni{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:32px;border-radius:999px;background:var(--omni);padding:0 14px;font-size:13px;color:var(--chrome-ink)}
.omni span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.omni .host{color:var(--chrome-sub)}
.omni svg{width:13px;height:13px;flex:none;color:var(--chrome-sub)}
.extbtn{color:var(--pn-accent)}
.extbtn.on{background:var(--pn-accent-soft)}
.extbtn .badge{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--pn-accent);border:1.5px solid var(--chrome-hi)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--chrome);display:grid;place-items:center;font-size:11px;color:var(--chrome-ink);flex:none}

.viewport{flex:1;min-height:0;display:flex;position:relative;background:var(--site-bg)}

/* ── Fictional brokerage site ── */
.site{flex:1;min-width:0;overflow:auto;font-family:var(--f-site);container-type:inline-size;color:var(--site-ink)}
.s-head{display:flex;align-items:center;gap:22px;padding:0 22px;height:52px;background:var(--site-card);border-bottom:1px solid var(--site-line);position:sticky;top:0;z-index:2}
.s-logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--site-brand);white-space:nowrap}
.s-logo i{width:22px;height:22px;border-radius:6px;background:var(--site-brand);display:block}
.s-logo small{font-weight:500;color:var(--site-sub);font-size:11px}
.s-nav{display:flex;gap:18px;font-size:14px;color:var(--site-sub);overflow:hidden;white-space:nowrap}
.s-nav .on{color:var(--site-ink);font-weight:700}
.s-body{padding:18px 22px 28px;display:grid;gap:16px}
.s-card{background:var(--site-card);border:1px solid var(--site-line);border-radius:10px}
.acct{display:flex;flex-wrap:wrap;gap:12px 32px;padding:16px 20px;align-items:flex-end}
.acct .k{font-size:12px;color:var(--site-sub)}
.acct .v{font-size:18px;font-weight:600;margin-top:2px}
.acct .v.big{font-size:22px}
.s-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@container (max-width:1040px){.s-grid{grid-template-columns:minmax(0,1fr)}}
.s-sec-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 10px}
.s-sec-h h2{font-size:15px;margin:0}
.s-sec-h span{font-size:12px;color:var(--site-sub)}
.tblwrap{overflow-x:auto}
table.hold{width:100%;border-collapse:collapse;font-size:13px;min-width:540px}
.hold th{font-weight:500;color:var(--site-sub);text-align:right;padding:8px 14px;border-top:1px solid var(--site-line);border-bottom:1px solid var(--site-line);font-size:12px;white-space:nowrap}
.hold th:first-child,.hold td:first-child{text-align:left}
.hold td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--site-line);white-space:nowrap}
.hold tbody tr{cursor:pointer}
.hold tbody tr:hover{background:var(--site-hover)}
.hold tbody tr.sel{background:var(--site-sel)}
.hold .nm{font-weight:600}
.hold .cd{font-size:11px;color:var(--site-sub);margin-top:2px}
.hold .mark{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--pn-accent);margin-left:6px;font-weight:500}
.hold .mark svg{width:11px;height:11px}
.up{color:var(--up)} .down{color:var(--down)}
.det{padding:16px 18px;display:grid;gap:14px}
.det-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.det-top h3{margin:0;font-size:17px}
.det-top .sub{font-size:12px;color:var(--site-sub);margin-top:2px}
.price{text-align:right}
.price .p{font-size:22px;font-weight:600}
.price .c{font-size:12px}
.chart{width:100%;max-width:520px;height:auto;display:block}
.pos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;font-size:13px}
.pos div{display:flex;justify-content:space-between;gap:8px}
.pos .k{color:var(--site-sub)}
.order{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.order button{height:40px;border-radius:8px;font-weight:600;font-size:14px;color:#fff}
.order .b{background:var(--up)} .order .s{background:var(--down)}
.ordermsg{font-size:12px;color:var(--site-sub);min-height:16px}
.news{list-style:none;margin:0;padding:0 18px 14px;display:grid}
.news li{padding:10px 0;border-top:1px solid var(--site-line);font-size:13px;display:grid;gap:3px}
.news .meta{font-size:11px;color:var(--site-sub)}

/* ── Nudge (light, non-alarming) ── */
.nudge{position:absolute;top:10px;right:14px;z-index:6;width:min(320px,calc(100% - 28px));background:var(--pn-card);color:var(--pn-ink);border:1px solid var(--pn-line);border-radius:12px;box-shadow:var(--shadow);padding:14px 14px 12px;font-family:var(--f-ui);display:grid;gap:10px}
.nudge::before{content:"";position:absolute;top:-6px;right:62px;width:10px;height:10px;background:var(--pn-card);border-left:1px solid var(--pn-line);border-top:1px solid var(--pn-line);transform:rotate(45deg)}
.nudge .who{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--pn-sub)}
.nudge .who svg{width:14px;height:14px;color:var(--pn-accent)}
.nudge p{margin:0;font-size:14px;line-height:1.5}
.nudge .row{display:flex;gap:8px;justify-content:flex-end}

/* ── Side panel ── */
.panel{flex:none;width:var(--panel-w);max-width:100%;border-left:1px solid var(--chrome);background:var(--pn-bg);color:var(--pn-ink);display:flex;flex-direction:column;min-height:0;position:relative;font-family:var(--f-ui)}
.resize{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:3}
.resize:hover,.resize.drag{background:linear-gradient(90deg,transparent 3px,var(--pn-accent) 3px,var(--pn-accent) 5px,transparent 5px)}
.p-head{padding:10px 14px 0;background:var(--pn-card);border-bottom:1px solid var(--pn-line)}
.p-brand{display:flex;align-items:center;gap:8px;justify-content:space-between}
.p-brand .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.p-brand .nm svg{width:20px;height:20px;color:var(--pn-accent)}
.p-brand .nm small{font-weight:400;font-size:11px;color:var(--pn-sub)}
.icon-btn{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--pn-sub)}
.icon-btn:hover{background:var(--pn-accent-soft);color:var(--pn-ink)}
.icon-btn svg{width:16px;height:16px}
.p-tabs{display:flex;gap:18px;margin-top:8px}
.p-tabs button{padding:8px 0 9px;font-size:13px;color:var(--pn-sub);border-bottom:2px solid transparent}
.p-tabs button.on{color:var(--pn-ink);font-weight:600;border-bottom-color:var(--pn-accent)}
.p-ctx{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;font-size:12px;color:var(--pn-sub);border-bottom:1px solid var(--pn-line)}
.p-ctx b{color:var(--pn-ink);font-weight:600;font-size:13px}
.steps{display:flex;gap:4px;padding:10px 14px 0}
.steps div{flex:1;display:grid;gap:5px;font-size:11px;color:var(--pn-sub)}
.steps i{height:3px;border-radius:2px;background:var(--pn-line);display:block}
.steps .done i,.steps .on i{background:var(--pn-accent)}
.steps .on{color:var(--pn-ink);font-weight:600}
.p-body{flex:1;overflow:auto;padding:14px;display:grid;grid-auto-rows:max-content;gap:14px;align-content:start}
.p-foot{padding:10px 14px;border-top:1px solid var(--pn-line);background:var(--pn-card);display:grid;gap:8px}
.p-foot .nav{display:flex;gap:8px}
.p-foot .nav .grow{flex:1}
.disc{font-size:11px;line-height:1.5;color:var(--pn-sub)}

h3.pt{margin:0;font-size:17px;line-height:1.4;text-wrap:balance;font-weight:600}
.lead{margin:0;font-size:13px;line-height:1.6;color:var(--pn-sub)}
.btn{height:40px;border-radius:9px;padding:0 16px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--pn-accent);color:var(--pn-accent-ink)}
.btn.pri:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{border:1px solid var(--pn-line);background:var(--pn-card);color:var(--pn-ink)}
.btn.ghost{color:var(--pn-sub);font-weight:500}
.btn.sm{height:32px;font-size:13px;padding:0 12px}
.link{color:var(--pn-accent);font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Source tags */
.src{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.02em}
.src svg{width:12px;height:12px}
.src.s-mine{color:var(--mine-tag)} .src.s-data{color:var(--pn-sub)} .src.s-ai{color:var(--ai-ink)}
.tag-inf{font-size:10px;font-weight:600;color:var(--ai-ink);border:1px dashed var(--ai-line);border-radius:4px;padding:0 5px;margin-left:4px;letter-spacing:.02em}

.mine{background:var(--mine-bg);border:1.5px solid var(--mine-line);border-radius:4px;padding:14px;display:grid;gap:10px;color:var(--mine-ink)}
.mine .when{font-size:11px;color:var(--pn-sub)}
.mine .quote{font-family:var(--f-mine);font-size:15px;line-height:1.75}
.mine dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13px;border-top:1px dotted var(--mine-line);padding-top:10px}
.mine dt{color:var(--pn-sub);font-size:12px;padding-top:2px}
.mine dd{margin:0;font-family:var(--f-mine);font-size:14px;line-height:1.55}
.mine .memo{font-family:var(--f-mine);font-size:14px;border-top:1px dotted var(--mine-line);padding-top:10px}

.ai{background:var(--ai-bg);border:1px dashed var(--ai-line);border-radius:10px;padding:12px 14px;color:var(--ai-ink);display:grid;gap:6px;font-size:13px;line-height:1.6}
.ai p{margin:0}
.data{background:var(--pn-card);border:1px solid var(--pn-line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.srcline{font-size:11px;color:var(--pn-sub);font-family:var(--f-num)}

.legend{display:grid;gap:8px}
.legend .r{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:8px;background:var(--pn-card);border:1px solid var(--pn-line)}
.legend .r b{font-size:12px}
.legend .r p{margin:0;font-size:12px;color:var(--pn-sub);line-height:1.5}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--pn-line);background:var(--pn-card);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--pn-ink)}
.chip[aria-pressed="true"]{border-color:var(--pn-accent);background:var(--pn-accent-soft);color:var(--pn-ink);font-weight:600}
.qlabel{font-size:13px;font-weight:600;margin:0}
.qhint{font-size:12px;color:var(--pn-sub);margin:0}

.recall{position:relative}
.cover{position:absolute;inset:0;border-radius:4px;background:color-mix(in srgb,var(--pn-bg) 86%,transparent);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:grid;place-content:center;gap:10px;padding:16px;text-align:center}
.cover p{margin:0;font-size:14px;font-weight:600}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--pn-card);border:1px solid var(--pn-line);border-radius:9px;padding:3px}
.seg button{height:30px;border-radius:7px;font-size:12px;color:var(--pn-sub)}
.seg button.on{background:var(--pn-accent-soft);color:var(--pn-ink);font-weight:600}

.cmp{background:var(--pn-card);border:1px solid var(--pn-line);border-radius:10px;overflow:hidden}
.cmp-h{display:grid;grid-template-columns:1fr 1fr;font-size:11px;color:var(--pn-sub);border-bottom:1px solid var(--pn-line)}
.cmp-h div{padding:8px 12px;display:flex;align-items:center;gap:5px}
.cmp-h div+div{border-left:1px solid var(--pn-line)}
.cmp-h svg{width:12px;height:12px}
.cmp-row{border-bottom:1px solid var(--pn-line)}
.cmp-row:last-child{border-bottom:0}
.cmp-lbl{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 0;font-size:12px;color:var(--pn-sub);gap:8px}
.cmp-vals{display:grid;grid-template-columns:1fr 1fr}
.cmp-vals div{padding:6px 12px 8px;min-width:0}
.cmp-vals div+div{border-left:1px solid var(--pn-line)}
.cmp-vals .past{font-family:var(--f-mine);font-size:15px;color:var(--mine-ink)}
.cmp-vals .now{font-family:var(--f-num);font-size:15px;font-weight:500}
.cmp-vals .now.txt{font-family:var(--f-ui);font-size:13px;font-weight:500}
.cmp-note{padding:0 12px 10px;font-size:12px;line-height:1.55;color:var(--pn-sub)}
.st{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.st.in{color:var(--st-in);background:var(--st-in-bg)}
.st.diff{color:var(--st-diff);background:var(--st-diff-bg)}
.st.check{color:var(--st-check);background:var(--st-check-bg)}
.gap-bar{height:6px;border-radius:3px;background:var(--pn-line);position:relative;margin:6px 12px 10px}
.gap-bar .lim{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--mine-line)}
.gap-bar .cur{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--st-diff)}
.gap-bar .cur.ok{background:var(--st-in)}
.gap-scale{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:10px;color:var(--pn-sub);padding:0 12px 10px;margin-top:-6px}

.only{background:var(--pn-card);border:1px solid var(--pn-line);border-radius:10px;padding:18px 14px;display:grid;gap:4px;text-align:center}
.only .big{font-family:var(--f-num);font-size:32px;font-weight:500}

.tl{display:grid;gap:0}

function compare(h){
  const r=h.record, pct=pctOf(h), w=weightOf(h), m=monthsBetween(h.buyDate,NOW), d=daysBetween(h.buyDate,NOW);
  const rows=[];
  if(r.lossLimit!=null&&r.lossLimit!==""){
    const lim=Number(r.lossLimit);
    if(pct<lim){const g=(lim-pct);rows.push({k:"loss",lbl:"손실 허용 범위",past:`${lim}%`,now:`${sgn(pct)}%`,st:"diff",stl:`${g.toFixed(1)}%p 벗어남`,
      note:`현재 수익률은 직접 설정한 손실 허용 범위를 ${g.toFixed(1)}%p 벗어났습니다. 다만 수익률 변화만으로 매수 당시의 투자 근거가 달라졌는지는 알 수 없습니다.`,bar:{lim,pct}})}
    else rows.push({k:"loss",lbl:"손실 허용 범위",past:`${lim}%`,now:`${sgn(pct)}%`,st:"in",stl:"기준 안",
      note:pct>=0?`현재 수익 구간이라 손실 허용 범위와는 ${(pct-lim).toFixed(1)}%p 떨어져 있어요.`:`손실 허용 범위까지 ${(pct-lim).toFixed(1)}%p 남아 있어요.`,bar:{lim,pct}});
  } else rows.push({k:"loss",lbl:"손실 허용 범위",past:"기록 없음",now:`${sgn(pct)}%`,st:"check",stl:"기준 없음",note:"직접 정한 손실 허용 범위가 없어 비교하지 않았어요. AI가 대신 정하지 않습니다."});
  if(r.periodM){
    const [a,b]=r.periodM; let st="in",stl="계획 기간 안",note;
    if(m<a) note=`보유 ${m}개월(${d}일)째로, 계획한 기간(${r.period})의 초반이에요.`;
    else if(m<=b) note=`보유 ${m}개월째로, 계획한 기간(${r.period}) 안에 있어요.`;
    else {st="diff";stl="계획 기간 지남";note=`계획한 기간(${r.period})을 ${m-b}개월 지났어요.`}
    rows.push({k:"period",lbl:"투자 기간",past:r.period,now:`${m}개월 경과`,st,stl,note});
  } else rows.push({k:"period",lbl:"투자 기간",past:"정하지 않음",now:`${m}개월 경과`,st:"check",stl:"기준 없음",note:"투자 기간을 정하지 않아 비교하지 않았어요."});
  if(r.weightCap!=null&&r.weightCap!==""){
    const cap=Number(r.weightCap);
    if(w>cap) rows.push({k:"weight",lbl:"종목 비중 상한",past:`${cap}% 이하`,now:`${w.toFixed(1)}%`,st:"diff",stl:`${(w-cap).toFixed(1)}%p 넘음`,note:`평가금액 기준으로 계좌에서 이 종목이 차지하는 비중이 직접 정한 상한을 ${(w-cap).toFixed(1)}%p 넘었어요.`});
    else rows.push({k:"weight",lbl:"종목 비중 상한",past:`${cap}% 이하`,now:`${w.toFixed(1)}%`,st:"in",stl:"기준 안",note:`비중 상한까지 ${(cap-w).toFixed(1)}%p 여유가 있어요.`});
  }
  if(r.extra) rows.push({k:"extra",lbl:r.extra.k,past:r.extra.v,now:"계좌 데이터로 판단 불가",nowTxt:true,st:"check",stl:"직접 확인",note:"직접 적은 조건이에요. 충족 여부는 계좌 수치로 알 수 없어 표시만 해 두었어요."});
  rows.push({k:"reason",lbl:"투자 근거",past:r.reasonShort||shortReason(h),now:"변화 여부 확인 필요",nowTxt:true,st:"check",stl:"확인 필요",note:"수익률만으로는 매수 이유가 지금도 유효한지 알 수 없어요. 아래 ‘기록 이후 달라진 정보’를 함께 보세요."});
  return rows;
}

/* ───────── brokerage site ───────── */
function series(h){
  const n=h.id==="C"?26:h.id==="B"?45:66; let x=h.seed; const rnd=()=>{x=(x*9301+49297)%233280;return x/233280};
  const w=[0]; for(let i=1;i<n;i++) w.push(w[i-1]+(rnd()-.5)*2);
  if(h.id==="B") w[n-1]=w[n-2]+3.2;
  const start=h.avg, end=h.price, out=[];
  for(let i=0;i<n;i++){const t=i/(n-1);const bridge=w[i]-t*w[n-1];out.push(start+(end-start)*t+bridge*start*0.022)}
  return out;
}
function chartSVG(h){
  const s=series(h), W=420,Hh=160,pl=6,pr=58,pt=12,pb=22;
  const lo=Math.min(...s,h.avg)*0.985, hi=Math.max(...s,h.avg)*1.015;
  const X=i=>pl+i*(W-pl-pr)/(s.length-1), Y=v=>pt+(hi-v)/(hi-lo)*(Hh-pt-pb);
  const pts=s.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const ya=Y(h.avg), yl=Y(s[s.length-1]);
  const grid=[0,1,2,3].map(k=>{const v=lo+(hi-lo)*k/3;return `<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--site-line)" stroke-width="1"/><text x="${W-pr+6}" y="${Y(v)+4}" font-size="11.5" fill="var(--site-sub)" font-family="IBM Plex Mono,monospace">${won(v)}</text>`}).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(h.name)} 보유 기간 주가 추이 (가상)">
    ${grid}
    <line x1="${pl}" x2="${W-pr}" y1="${ya}" y2="${ya}" stroke="var(--site-sub)" stroke-dasharray="4 4" stroke-width="1"/>
    <text x="${pl+4}" y="${ya-5}" font-size="11.5" fill="var(--site-sub)">내 평단 ${won(h.avg)}</text>
    <polyline points="${pts}" fill="none" stroke="var(--site-ink)" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="${X(s.length-1)}" cy="${yl}" r="3.5" fill="var(--site-ink)"/>
    <text x="${pl}" y="${Hh-6}" font-size="11.5" fill="var(--site-sub)">${fmtD(h.buyDate).slice(5)} 매수</text>
    <text x="${W-pr}" y="${Hh-6}" font-size="11.5" fill="var(--site-sub)" text-anchor="end">11.17</text>
  </svg>`;
}

function vRecord(h){
  const s=state.s, r=h.record;
  const recallOpts=[["clear","분명히 기억나요"],["vague","어렴풋이 기억나요"],["no","잘 기억나지 않아요"]];
  const imp=[["reason","매수 이유"],["period","투자 기간"],["loss","손실 허용 범위"]].concat(r.weightCap!=null&&r.weightCap!==""?[["weight","종목 비중"]]:[]).concat(r.extra?[["extra",r.extra.k]]:[]).concat([["review","재검토 조건"]]).concat(r.memo?[["memo","나에게 남긴 메모"]]:[]);
  return [`
    <h3 class="pt">${r.origin==="buy"?"매수 당시":"보유 중"} 내가 남긴 기록</h3>
    <p class="lead">AI가 요약하거나 고쳐 쓰지 않은 원문이에요. ${r.origin==="buy"?"":"이 기준은 매수 이후에 작성되었어요."}</p>
    <div class="recall">${recordCard(h)}
      ${s.revealed?"":`<div class="cover"><p>기록을 펼치기 전에,<br>이 종목을 왜 샀는지 기억나나요?</p>
        <div class="chips" style="justify-content:center">${recallOpts.map(o=>`<button class="chip" data-recall="${o[0]}">${o[1]}</button>`).join("")}</div>
        <button class="link" data-recall="skip">바로 기록 보기</button></div>`}
    </div>
    ${s.revealed?`<div class="field"><p class="qlabel">지금 가장 중요하게 느껴지는 기준은 무엇인가요?</p><p class="qhint">여러 개 골라도 되고, 고르지 않아도 돼요.</p>
      <div class="chips">${imp.map(o=>`<button class="chip" aria-pressed="${s.important.includes(o[0])}" data-imp="${o[0]}">${esc(o[1])}</button>`).join("")}</div></div>`:""}`,
  `<div class="nav"><button class="btn sec" data-go="entry">이전</button><button class="btn pri grow" data-go="compare" ${s.revealed?"":"disabled"}>현재 상황과 비교하기</button></div>`];
}

function vCompare(h){
  const s=state.s, rows=compare(h), p=pctOf(h);
  const seg=`<div class="seg" role="tablist" aria-label="보기 방식"><button class="${s.view==="compare"?"on":""}" data-view="compare">기준과 함께 보기</button><button class="${s.view==="only"?"on":""}" data-view="only">수익률만 보기</button></div>`;
  if(s.view==="only") return [`<h3 class="pt">지금의 수익률</h3>${seg}
    <div class="only">${srcTag("data","계좌 데이터")}<div class="big ${cls(p)}" style="color:var(--pn-ink)">${sgn(p)}%</div><div class="num" style="font-size:13px;color:var(--pn-sub)">평가손익 ${won(evalOf(h)-costOf(h))}원 · 평가금액 ${won(evalOf(h))}원</div><div class="srcline">출처: 가상증권 계좌 · ${ASOF}</div></div>
    <p class="lead">기존 증권 화면에서 보던 정보예요. 이 숫자만으로는 내 기준과의 관계나 투자 근거의 변화를 알기 어려워요. ‘기준과 함께 보기’로 바꿔 차이를 비교해 보세요.</p>`,
    `<div class="nav"><button class="btn sec" data-go="record">이전</button><button class="btn pri grow" data-view="compare">기준과 함께 보기</button></div>`];
  const nIn=rows.filter(r=>r.st==="in").length,nDiff=rows.filter(r=>r.st==="diff").length,nChk=rows.filter(r=>r.st==="check").length;
  const lossRow=rows.find(r=>r.k==="loss"&&r.bar);
  const rowHTML=rows.map(r=>{
    let bar="";
    if(r.bar){const lo=Math.min(-40,Math.floor((Math.min(r.bar.pct,r.bar.lim)-5)/10)*10),hi=Math.max(20,Math.ceil((r.bar.pct+5)/10)*10),pos=v=>((v-lo)/(hi-lo)*100);
      const a=Math.min(pos(0),pos(r.bar.pct)),b=Math.max(pos(0),pos(r.bar.pct));
      bar=`<div class="gap-bar" aria-hidden="true"><span class="cur ${r.st==="in"?"ok":""}" style="left:${a}%;width:${b-a}%"></span><span class="lim" style="left:${pos(r.bar.lim)}%" title="내 기준"></span></div>
        <div class="gap-scale"><span>${lo}%</span><span>기준 ${r.bar.lim}% │ 0%</span><span>+${hi}%</span></div>`}
    return `<div class="cmp-row"><div class="cmp-lbl"><span>${esc(r.lbl)}</span><span class="st ${r.st}">${esc(r.stl)}</span></div>
      <div class="cmp-vals"><div class="past">${esc(r.past)}</div><div class="now ${r.nowTxt?"txt":""}">${esc(r.now)}</div></div>${bar}
      <div class="cmp-note">${esc(r.note)}</div></div>`}).join("");
  const then=h.info.filter(i=>i.ph==="then"), now=h.info.filter(i=>i.ph==="now");
  const relL={direct:"투자 근거와 직접 관련",indirect:"시장 전반 · 간접 관련",opinion:"의견 · 사실 확인 필요",unknown:"관련성 판단 보류"};
  const dirL={"+":"긍정적 정보","−":"부정적 정보","±":"긍정·부정 혼재","?":"아직 확인되지 않음"};
  const item=i=>`<div class="tl-i ${i.ph}"><span class="dot"></span><div><div class="t">${esc(i.t)}</div><div class="m"><span class="srcline">${esc(i.d)} · ${esc(i.src)}</span><span class="dir">${dirL[i.dir]}</span>${i.ph==="now"?`<span class="rel">${relL[i.rel]} <b>· 추론</b></span>`:""}</div></div></div>`;
  return [`
    <h3 class="pt">과거의 나와 지금의 나</h3>
    ${seg}
    <div class="cmp">
      <div class="cmp-h"><div>${IC.mine}그때 내가 정한 기준</div><div>${IC.data}지금 · ${ASOF.replace(" 기준","")}</div></div>
      ${rowHTML}
    </div>
    <div class="srcline">현재 수치 출처: 가상증권 계좌 · 비중은 총 자산(예수금 포함) 대비 평가금액</div>
    <div class="data">
      ${srcTag("ai","기록 이후 달라진 정보")}
      <div class="tl">
        <div class="tl-h">매수 당시 알던 정보</div>${then.length?then.map(item).join(""):`<p class="qhint">매수 당시 정보가 기록되어 있지 않아요.</p>`}
        <div class="tl-h">이후 새로 나온 정보</div>${now.map(item).join("")}
      </div>
      <p class="qhint">관련성 분류는 AI의 추론이에요. 사실 여부와 의미는 원문 출처에서 직접 확인해 주세요.</p>
    </div>
    <div class="ai">${srcTag("ai","AI 정리")}<span class="tag-inf" style="justify-self:start;margin:0">결론 아님 · 비교 결과</span>
      <p>직접 정한 기준 ${rows.length}개 중 <b>${nIn}개는 기준 안</b>, <b>${nDiff}개는 기준과 차이</b>, <b>${nChk}개는 직접 확인이 필요</b>해요.</p>
      ${lossRow&&lossRow.st==="diff"?`<p>${esc(lossRow.note)}</p>`:""}
      <p>기록 이후 나온 정보에는 투자 근거와 직접 관련된 것과 시장 전반·외부 의견이 섞여 있어요. 이 정리는 어떤 행동이 맞는지 판단하지 않아요.</p>
    </div>`,
  `<div class="nav"><button class="btn sec" data-go="record">이전</button><button class="btn pri grow" data-go="questions">판단을 돕는 질문 보기</button></div>`];
}

function vQuestions(h){
  const s=state.s, qs=h.q.slice(0,s.qShown), left=h.q.length-s.qShown;
  return [`
    <h3 class="pt">스스로 판단하는 데 도움이 될 질문</h3>
    <p class="lead">정답이 있는 질문이 아니에요. 답하지 않아도 다음으로 넘어갈 수 있어요.</p>
    ${qs.map((q,i)=>`<div class="qcard">
      <div style="display:flex;justify-content:space-between;align-items:center">${srcTag("ai","AI가 고른 질문")}<span class="qn">${i+1} / ${h.q.length}</span></div>
      <p class="qt">${esc(q.t)}</p>
      <details><summary>왜 이 질문인가요? <span class="tag-inf">추론</span></summary><p>${esc(q.why)}</p></details>
      <textarea id="note-${h.id}-${i}" data-note="${i}" rows="2" placeholder="내 생각 (선택) · 짧게 적어도 괜찮아요">${esc(s.notes[i]||"")}</textarea>
    </div>`).join("")}
    ${left>0?`<button class="btn sec sm" data-act="moreQ" style="justify-self:start">질문 하나 더 보기 (${left}개 남음)</button>`:""}`,
  `<div class="nav"><button class="btn sec" data-go="compare">이전</button><button class="btn pri grow" data-go="decide">내 판단 정리하기</button></div>`];
}

const CHOICES=[
  ["basis","기존 투자 근거를 다시 확인하고 싶다","매수 이유가 지금도 유효한지 스스로 점검"],
  ["info","달라진 정보가 무엇인지 더 확인하고 싶다","원문 공시·실적 등 출처를 직접 확인"],
  ["criteria","내 투자 기준을 재검토하고 싶다","손실 허용 범위·기간·비중 등을 다시 생각"],
  ["record","현재 판단을 기록하고 나중에 다시 살펴보고 싶다","지금의 생각을 남겨 두고 정해 둔 시점에 다시 보기"]
];
const REVISIT=["1주 후","다음 실적 발표 후","한 달 후","정하지 않음"];
function vDecide(h){
  const s=state.s, ok=s.text.trim().length>=5;
  return [`
    <h3 class="pt">지금 나는 어떻게 판단하고 있나요?</h3>
    <p class="lead">매수·매도 버튼이 아니라 생각의 다음 단계를 고르는 선택지예요. 여러 개 골라도 돼요.</p>
    <div class="opts">${CHOICES.map(c=>`<button class="opt" aria-pressed="${s.choices.includes(c[0])}" data-choice="${c[0]}"><span class="box">${IC.check}</span><span><b>${c[1]}</b><span>${c[2]}</span></span></button>`).join("")}</div>
    ${s.choices.includes("criteria")?`<div class="field"><label for="critEdit">바꾸고 싶은 기준이 있다면 직접 적어 두세요 (선택)</label>
      <input type="text" id="critEdit" data-field="criteriaEdit" value="${esc(s.criteriaEdit)}" placeholder="예: 손실 허용 범위를 다시 정하기 전에 3분기 실적 원문부터 읽기">
      <span class="help">원래 기록은 그대로 보존되고, 변경 메모는 이번 판단 기록에 함께 저장돼요.</span></div>`:""}
    <div class="field"><label for="judgeText">${IC.mine.replace('<svg','<svg style="width:12px;height:12px;vertical-align:-1px"')} 나의 판단 기록</label>
      <textarea id="judgeText" class="mine-input" data-field="text" placeholder="예: 현재 손실은 기준을 벗어났지만, 사업의 성장 근거가 훼손되었는지 추가 확인한 뒤 내 기준을 다시 검토하겠다.">${esc(s.text)}</textarea>
      <span class="help">AI는 이 기록을 고쳐 쓰거나 평가하지 않아요.</span></div>
    <div class="field"><label>다시 살펴볼 시점</label><div class="chips">${REVISIT.map(r=>`<button class="chip" aria-pressed="${s.revisit===r}" data-revisit="${r}">${r}</button>`).join("")}</div></div>`,
  `<div class="nav"><button class="btn sec" data-go="questions">이전</button><button class="btn pri grow" id="saveBtn" data-act="save" ${ok?"":"disabled"}>판단 기록 저장</button></div>
   <div class="disc" id="saveHint" ${ok?"hidden":""}>판단 기록을 5자 이상 쓰면 저장할 수 있어요.</div>`];
}

const choiceLabel=k=>(CHOICES.find(c=>c[0]===k)||[,k])[1];
const impLabel={reason:"매수 이유",period:"투자 기간",loss:"손실 허용 범위",weight:"종목 비중",extra:"추가 조건",review:"재검토 조건",memo:"나에게 남긴 메모"};
const recallLabel={clear:"분명히 기억남",vague:"어렴풋이 기억남",no:"잘 기억나지 않음",skip:"건너뜀"};
function recCard(r,expand){
  const h=H[r.stock]; const at=r.at.replace("T"," ").replace(/-/g,".");
  const nowP=pctOf(h);
  const tr=r.trace?Object.entries(r.trace).filter(e=>e[0]!=="done").map(e=>`${({entry:"진입",record:"내 기록",compare:"비교",questions:"질문",decide:"판단"})[e[0]]||e[0]} ${Math.round(e[1]/1000)}초`).join(" · "):"";
  return `<div class="rec">
    <div class="rec-h"><b>${esc(h.name)}</b><span class="num">${at}</span></div>
    <div class="snap"><span class="kv num">기록 당시 ${sgn(r.pct)}%</span><span class="kv num">지금 ${sgn(nowP)}%</span>${(r.diffs||[]).map(d=>`<span class="kv">${esc(d)}</span>`).join("")}${r.seed?`<span class="kv">예시 기록</span>`:""}</div>
    <div class="txt">${esc(r.text)}</div>
    <div class="snap">${(r.choices||[]).map(c=>`<span class="kv">${esc(choiceLabel(c))}</span>`).join("")}${r.revisit?`<span class="due">다시 살펴볼 시점: ${esc(r.revisit)}</span>`:""}</div>
    ${expand?`<div class="more">
      ${r.criteriaEdit?`<div><span class="k">기준 변경 메모</span><span>${esc(r.criteriaEdit)}</span></div>`:""}
      ${r.important&&r.important.length?`<div><span class="k">중요하게 본 기준</span><span>${r.important.map(k=>impLabel[k]||k).join(", ")}</span></div>`:""}
      ${r.recall?`<div><span class="k">매수 이유 회상</span><span>${recallLabel[r.recall]}</span></div>`:""}
      ${Object.keys(r.notes||{}).filter(k=>r.notes[k]).map(k=>`<div><span class="k">질문 ${+k+1} 메모</span><span>${esc(r.notes[k])}</span></div>`).join("")}
      ${r.viewedOnly?`<div><span class="k">보기 방식</span><span>‘수익률만 보기’도 확인함</span></div>`:""}
      ${tr?`<div><span class="k">과정 (테스트용)</span><span class="num" style="font-size:11px">${tr}</span></div>`:""}
      ${r.fb&&Object.keys(r.fb).length?`<div><span class="k">피드백 (1–5)</span><span class="num" style="font-size:11px">${Object.entries(r.fb).map(e=>`${FB.find(f=>f[0]===e[0])[2]} ${e[1]}`).join(" · ")}</span></div>`:""}
    </div>`:`<button class="link" data-openrec="${r.id}" style="justify-self:start">자세히 보기</button>`}
  </div>`;
}
const FB=[["h1","매수 당시 기록을 다시 보는 것이 도움이 되었다","회상"],["h2","기준과 현재를 나란히 보니 상황이 더 잘 이해되었다","비교"],["h3","판단의 주도권이 나에게 있다고 느꼈다","주도권"],["h3b","AI가 지나치게 개입한다고 느꼈다","개입감"]];
function vDone(h){
  const r=state.records.find(x=>x.id===state.lastSaved);
  return [`
    <div class="ok-banner">${IC.ok}판단을 기록했어요</div>
    ${r?recCard(r,true):""}
    <p class="lead">저장한 기록은 ‘판단 기록’ 탭에서 언제든 다시 볼 수 있어요. 다음에 이 종목이 흔들릴 때 이 기록이 ‘과거의 나’로 함께 표시돼요.</p>
    <div class="data likert">
      <div style="display:flex;justify-content:space-between;align-items:center">${srcTag("data","짧은 피드백")}<span class="qhint">테스트 참가자용 · 선택</span></div>
      ${FB.map(f=>`<div class="li"><p>${f[1]}</p><div class="scale">${[1,2,3,4,5].map(n=>`<button aria-pressed="${r&&r.fb&&r.fb[f[0]]===n}" data-fb="${f[0]}" data-n="${n}">${n}</button>`).join("")}</div><div class="scale-l"><span>전혀 아니다</span><span>매우 그렇다</span></div></div>`).join("")}
    </div>`,
  `<div class="nav"><button class="btn sec" data-act="closePanel">패널 닫기</button><button class="btn pri grow" data-tab="archive">판단 기록 모아 보기</button></div>`];
}

function vArchive(){
  const list=state.records.filter(r=>state.filter==="all"||r.stock===state.sel).sort((a,b)=>b.at.localeCompare(a.at));
  const h=H[state.sel];
  return [`
    <h3 class="pt">저장된 판단 기록</h3>
    <div class="seg"><button class="${state.filter==="cur"?"on":""}" data-filter="cur">${esc(h.name)}</button><button class="${state.filter==="all"?"on":""}" data-filter="all">전체 종목</button></div>
    ${h.record&&state.filter==="cur"?`<details class="data"><summary style="cursor:pointer;font-size:13px;font-weight:600">기준 원문 보기 · ${esc(h.record.written)}</summary><div style="margin-top:10px">${recordCard(h)}</div></details>`:""}
    ${list.length?list.map(r=>recCard(r,state.openRec===r.id)).join(""):`<div class="empty">아직 이 종목에 남긴 판단 기록이 없어요.<br>‘기준 확인’ 탭에서 첫 기록을 남길 수 있어요.</div>`}
    <div class="sep"></div>
    <button class="link" data-act="reset" style="justify-self:start;color:var(--pn-sub)">데모 데이터 초기화</button>
    <div class="disc" id="resetMsg"></div>`,
  `<div class="nav"><button class="btn pri grow" data-tab="check">기준 확인으로 돌아가기</button></div>`];
}

function vNoCriteria(h){
  const p=pctOf(h), m=monthsBetween(h.buyDate,NOW), d=daysBetween(h.buyDate,NOW);
  return [`
    <h3 class="pt">이 종목에는 매수 당시 남긴 기준이 없어요</h3>
    <p class="lead">AI는 투자 이유나 기준을 대신 만들거나 추측하지 않아요. 비교할 기준이 없으니, 원하면 지금 직접 정리해 둘 수 있어요.</p>
    <div class="data">${srcTag("data","현재의 나")}
      <div class="pos" style="font-size:13px"><div><span class="k" style="color:var(--pn-sub)">수익률</span><span class="num">${sgn(p)}%</span></div><div><span class="k" style="color:var(--pn-sub)">비중</span><span class="num">${weightOf(h).toFixed(1)}%</span></div><div><span class="k" style="color:var(--pn-sub)">보유</span><span class="num">${d}일</span></div><div><span class="k" style="color:var(--pn-sub)">매수일</span><span class="num">${fmtD(h.buyDate)}</span></div></div>
      <div class="srcline">출처: 가상증권 계좌 · ${ASOF}</div></div>
    <div class="cmp"><div class="cmp-h"><div>${IC.mine}그때 내가 정한 기준</div><div>${IC.data}지금</div></div>
      ${["매수 이유","투자 기간","손실 허용 범위","재검토 조건"].map(l=>`<div class="cmp-row"><div class="cmp-lbl"><span>${l}</span><span class="st check">기록 없음</span></div><div class="cmp-vals"><div class="past" style="color:var(--pn-sub)">—</div><div class="now txt" style="color:var(--pn-sub)">비교할 수 없음</div></div></div>`).join("")}</div>`,
  `<div class="nav"><button class="btn ghost" data-act="closePanel">닫기</button><button class="btn pri grow" data-go="setup">지금 내 기준 정리하기</button></div>`];
}
function vSetup(h){
  const f=state.setup||(state.setup={reason:"",period:"",loss:"",review:""});
  const periods=["3개월 이내","3~12개월","1~2년","2년 이상","정하지 않음"];
  return [`
    <h3 class="pt">${esc(h.name)} · 내 기준 정리하기</h3>
    <p class="lead">질문에 답하듯 직접 적어 주세요. 비워 둔 항목은 ‘정하지 않음’으로 남고, AI가 채우지 않아요. 이 기록에는 <b>매수 이후 작성</b>이라고 표시돼요.</p>
    <div class="field"><label for="su-reason">이 종목을 왜 샀나요?</label><textarea id="su-reason" class="mine-input" style="min-height:90px" data-setup="reason" placeholder="그때 떠올렸던 이유를 내 말로 적어 보세요">${esc(f.reason)}</textarea></div>
    <div class="field"><label>얼마 동안 보유할 생각이었나요?</label><div class="chips">${periods.map(x=>`<button class="chip" aria-pressed="${f.period===x}" data-setperiod="${x}">${x}</button>`).join("")}</div></div>
    <div class="field"><label for="su-loss">어느 정도 손실까지 감수할 수 있나요?</label><div class="inline-num"><input type="number" id="su-loss" data-setup="loss" value="${esc(f.loss)}" placeholder="-15" max="0" step="1"><span class="qhint">% (비워 두면 정하지 않음)</span></div></div>
    <div class="field"><label for="su-review">어떤 일이 생기면 다시 검토하고 싶나요?</label><input type="text" id="su-review" data-setup="review" value="${esc(f.review)}" placeholder="예: 원가 부담으로 이익이 줄어들 때"></div>`,
  `<div class="nav"><button class="btn sec" data-go="entry">이전</button><button class="btn pri grow" data-act="saveSetup" id="setupBtn" ${f.reason.trim().length>=3?"":"disabled"}>내 기준 저장</button></div>`];
}

/* ───────── actions ───────── */
function selectStock(id){
  if(state.sel===id) return;
  state.sel=id; state.step="entry"; state.s=newSession(); state.orderMsg=""; state.setup=null; state.openRec=null;
  if(state.tab!=="archive") state.tab="check";
  renderSite(); renderPanel(); renderNudge();
}
function setOpen(v){
  state.open=v; $("#viewport").classList.toggle("open",v);
  $("#extBtn").classList.toggle("on",v); $("#extBtn").setAttribute("aria-pressed",String(v));
  $("#extBtn").setAttribute("aria-label",v?"My Decision Companion 패널 닫기":"My Decision Companion 패널 열기");
  if(v) state.nudged[state.sel]=true;
  renderPanel(); renderNudge();
}
function saveRecord(){
  const h=H[state.sel], s=state.s, t=Date.now();
  s.trace[s.cur]=(s.trace[s.cur]||0)+(t-s.t0); s.t0=t;
  const rows=compare(h).filter(r=>r.st!=="check").map(r=>`${r.lbl} ${r.stl}`);
  const id="r"+t.toString(36);
  const d=new Date(); const at=`${fmtD(NOW).replace(/\./g,"-")}T${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  state.records.push({id,stock:h.id,at,pct:+pctOf(h).toFixed(1),weight:+weightOf(h).toFixed(1),diffs:rows,choices:s.choices.slice(),text:s.text.trim(),revisit:s.revisit,criteriaEdit:s.criteriaEdit.trim(),important:s.important.slice(),recall:s.recall,notes:{...s.notes},viewedOnly:!!s.viewedOnly,trace:{...s.trace},fb:{}});
  state.lastSaved=id; persist(); goStep("done");
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-sel]"); if(!t) return;
  const ds=t.dataset;
  if(t.id==="extBtn"){setOpen(!state.open);return}
  if(ds.sel){selectStock(ds.sel);return}
  if(ds.order){state.orderMsg=`가상 화면입니다. ${ds.order} 주문은 실행되지 않아요.`;renderSite();return}
  if(ds.act==="openPanel"){state.tab="check";setOpen(true);return}
  if(ds.act==="dismissNudge"){state.nudged[state.sel]=true;renderNudge();return}
  if(ds.act==="closePanel"){setOpen(false);return}
  if(ds.tab){state.tab=ds.tab;if(ds.tab==="check"&&state.step==="done"){state.step="entry";state.s=newSession()}renderPanel();return}
  if(ds.go){goStep(ds.go);return}
  const s=state.s;
  if(ds.recall){s.recall=ds.recall;s.revealed=true;renderPanel();return}
  if(ds.imp){const i=s.important.indexOf(ds.imp);i<0?s.important.push(ds.imp):s.important.splice(i,1);t.setAttribute("aria-pressed",String(i<0));return}
  if(ds.view){s.view=ds.view;if(ds.view==="only")s.viewedOnly=true;renderPanel();return}
  if(ds.act==="moreQ"){s.qShown++;renderPanel();return}
  if(ds.choice){const i=s.choices.indexOf(ds.choice);i<0?s.choices.push(ds.choice):s.choices.splice(i,1);renderPanel();return}
  if(ds.revisit){s.revisit=s.revisit===ds.revisit?"":ds.revisit;renderPanel();return}
  if(ds.act==="save"){if(s.text.trim().length>=5)saveRecord();return}
  if(ds.fb){const r=state.records.find(x=>x.id===state.lastSaved);if(r){r.fb=r.fb||{};r.fb[ds.fb]=+ds.n;persist();renderPanel()}return}
  if(ds.filter){state.filter=ds.filter;renderPanel();return}
  if(ds.openrec){state.openRec=ds.openrec;renderPanel();return}
  if(ds.act==="reset"){
    if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="한 번 더 누르면 초기화돼요";return}
    state.records=SEED_RECORDS.slice();state.custom={};H.C.record=null;state.step="entry";state.s=newSession();state.tab="check";persist();renderSite();renderPanel();return}
  if(ds.setperiod){state.setup.period=state.setup.period===ds.setperiod?"":ds.setperiod;renderPanel();return}
  if(ds.act==="saveSetup"){
    const f=state.setup, map={"3개월 이내":[0,3],"3~12개월":[3,12],"1~2년":[12,24],"2년 이상":[24,999]};
    const loss=f.loss===""?null:-Math.abs(Number(f.loss));
    const rec={written:`${fmtD(NOW)} · 보유 중 작성 (매수 ${daysBetween(H.C.buyDate,NOW)}일 후)`,origin:"later",reason:f.reason.trim(),
      reasonShort:f.reason.trim().slice(0,22)+(f.reason.trim().length>22?"…":""),
      period:f.period&&f.period!=="정하지 않음"?f.period:"",periodM:map[f.period]||null,lossLimit:loss,weightCap:null,review:f.review.trim(),extra:null,memo:""};
    H[state.sel].record=rec; state.custom[state.sel]=rec; persist(); state.setup=null; state.s=newSession(); state.s.revealed=true; state.s.recall="skip";
    renderSite(); goStep("record"); return}
});
document.addEventListener("keydown",e=>{const r=e.target.closest("tr[data-sel]");if(r&&(e.key==="Enter"||e.key===" ")){e.preventDefault();selectStock(r.dataset.sel)}});
document.addEventListener("input",e=>{
  const t=e.target, s=state.s;
  if(t.dataset.note!=null){s.notes[t.dataset.note]=t.value;return}
  if(t.dataset.field){s[t.dataset.field]=t.value;
    if(t.dataset.field==="text"){const ok=t.value.trim().length>=5;const b=$("#saveBtn");if(b)b.disabled=!ok;const hn=$("#saveHint");if(hn)hn.hidden=ok}return}
  if(t.dataset.setup){state.setup[t.dataset.setup]=t.value;const b=$("#setupBtn");if(b)b.disabled=state.setup.reason.trim().length<3}
});

/* resize */
(function(){
  const handle=$("#resize"); let sx=0,sw=0,drag=false;
  const apply=w=>{state.panelW=Math.max(320,Math.min(560,w));document.documentElement.style.setProperty("--panel-w",state.panelW+"px")};
  apply(state.panelW);
  handle.addEventListener("pointerdown",e=>{drag=true;sx=e.clientX;sw=state.panelW;handle.classList.add("drag");handle.setPointerCapture(e.pointerId)});
  handle.addEventListener("pointermove",e=>{if(drag)apply(sw+(sx-e.clientX))});
  const end=()=>{if(drag){drag=false;handle.classList.remove("drag");persist()}};
  handle.addEventListener("pointerup",end);handle.addEventListener("pointercancel",end);
})();

renderSite(); renderPanel(); renderNudge();
})();
</script>

<!doctype html><html lang="ko"><head><script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('emb');</script><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WHYSE 모바일 · E11 · E07</title>
<style>
:root{--bg:#eef0f3;--ink:#191c23;--sub:#6b7280;--y:#C6F06A;--yi:#152000;--ysoft:#26301A;--dk:#141614;--dk2:#1C1F1B;--dk3:#262A25;--dln:#2C312B;--dt:#F1F4EE;--dt2:#B7BDB3;--dt3:#80877C;--red:#e8424d;--blue:#3d6ef5;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0c0e;--ink:#f2f3f5;--sub:#9aa0aa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0c0e;--ink:#f2f3f5;--sub:#9aa0aa}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 12px 24px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.top{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.top h1{font-size:15px;font-weight:700;letter-spacing:-.01em}
.top p{font-size:12px;color:var(--sub)}
.sw{display:flex;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:12px;padding:3px}
.sw button{height:34px;padding:0 14px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--sub)}
.sw button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.wrap{flex:1;display:flex;align-items:flex-start;justify-content:center;width:100%}
.phone{width:390px;height:844px;border-radius:58px;background:#000;padding:11px;box-shadow:0 30px 60px rgba(0,0,0,.18),0 0 0 1.5px #2b2c30 inset;transform-origin:top center;flex:none}
.scr{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;background:#fff;color:#111}
/* status bar */
.sb{position:absolute;top:0;left:0;right:0;height:52px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 34px;font-size:15px;font-weight:600;z-index:5;color:#111;transition:color .3s}
.sb.dark{color:#fff}
.sb svg{height:12px}
/* island */
.isl{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:20;transition:width .45s cubic-bezier(.3,1.3,.5,1),height .45s cubic-bezier(.3,1.3,.5,1),border-radius .45s;overflow:hidden;color:#fff;cursor:default}
.isl.compact{width:210px;cursor:pointer}
.isl.exp{width:356px;height:166px;border-radius:40px}
.isl .c{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 8px;opacity:0;transition:opacity .2s}
.isl.compact .c{opacity:1;transition-delay:.2s}
.isl .e{position:absolute;inset:0;padding:18px 20px 16px;display:flex;flex-direction:column;gap:10px;opacity:0;transition:opacity .2s}
.isl.exp .e{opacity:1;transition-delay:.25s}
.wl{width:22px;height:22px;border-radius:7px;background:var(--y);color:var(--yi);font-weight:900;font-size:13px;display:grid;place-items:center;flex:none}
.c .r{font-size:13px;font-weight:700;color:var(--y);font-variant-numeric:tabular-nums}
.e .h{display:flex;align-items:center;gap:8px;font-size:12px;color:#9a9ca3;font-weight:600}
.e .t{font-size:17px;font-weight:700;line-height:1.35;letter-spacing:-.02em}
.e .t small{display:block;font-size:13px;font-weight:500;color:#b4b6bd;margin-top:2px}
.e .b{display:flex;gap:8px;margin-top:auto}
.e .b button{flex:1;height:38px;border-radius:19px;font-size:14px;font-weight:700}
.e .b .n{background:#262A25;color:#F1F4EE}.e .b .y{background:var(--y);color:var(--yi)}
/* broker app */
.app{position:absolute;inset:0;padding-top:54px;display:flex;flex-direction:column;background:#fff}
.nav{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:16px;font-weight:600}
.nav svg{width:22px;height:22px}
.stk{padding:6px 22px 0}
.stk .nm{font-size:15px;color:#555;font-weight:600}.stk .nm span{font-size:12px;color:#999;margin-left:6px;font-weight:500}
.stk .pr{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.stk .ch{font-size:14px;color:var(--red);font-weight:600}
.spark{display:block;margin:10px 22px 0;height:70px;width:calc(100% - 44px)}
.hold{display:flex;gap:6px;margin:8px 22px 0;font-size:12.5px;color:#666}
.hold b{color:#111}
.ord{margin:12px 16px 0;border-radius:18px;background:#f6f7f9;padding:14px 16px;display:grid;gap:12px}
.otab{display:grid;grid-template-columns:1fr 1fr;background:#eceef1;border-radius:10px;padding:3px}
.otab span{height:32px;display:grid;place-items:center;border-radius:8px;font-size:14px;font-weight:700;color:#999}
.otab .on{background:#fff;color:var(--red);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.or{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.or .k{color:#777}.or .v{font-weight:700;font-variant-numeric:tabular-nums}
.stp{display:flex;align-items:center;background:#fff;border-radius:10px;border:1px solid #e3e5e8}
.stp button{width:34px;height:34px;font-size:18px;color:#555}
.stp b{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;border-top:1px solid #e6e8eb}
.tot .v{font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chip{display:flex;align-items:center;gap:8px;margin:10px 16px 0;padding:10px 12px;border-radius:12px;background:#141614;color:#F1F4EE;font-size:13px;font-weight:600;animation:up .3s ease}
.chip .wl{width:18px;height:18px;font-size:11px;border-radius:5px}
.chip .tx{flex:1}.chip i{font-style:normal;color:var(--y)}
.buy{margin:auto 16px 26px;height:54px;border-radius:14px;background:var(--red);color:#fff;font-size:17px;font-weight:700}
/* broker confirm sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:8;animation:fade .25s}
.bsheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:#fff;border-radius:26px 26px 0 0;padding:22px 22px 30px;display:grid;gap:14px;animation:up .3s cubic-bezier(.2,.9,.3,1)}
.bsheet h3{font-size:19px;font-weight:800}
.bsheet .row2{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.bsheet .row2 button{height:52px;border-radius:14px;font-weight:700;font-size:16px}
.bsheet .cx{background:#f0f1f3}.bsheet .ok{background:var(--red);color:#fff}
/* WHYSE sheet */
.ws{position:absolute;left:0;right:0;bottom:0;top:58px;z-index:12;background:var(--dk);color:var(--dt);border-radius:30px 30px 0 0;display:flex;flex-direction:column;animation:up .38s cubic-bezier(.2,.9,.3,1);overflow:hidden}
.ws-h{display:flex;align-items:center;gap:8px;padding:16px 18px 10px;font-size:14px;font-weight:700}
.ws-h .sub{color:var(--dt3);font-weight:500;font-size:12.5px}
.ws-h .x{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--dk3);display:grid;place-items:center}
.ws-h .x svg{width:12px;height:12px}
.grab{width:38px;height:5px;border-radius:3px;background:#3A4037;margin:8px auto 0}
.wb{flex:1;overflow:auto;padding:4px 20px 22px;display:flex;flex-direction:column;gap:16px}
.wb>*{flex-shrink:0}
.prog{display:flex;align-items:center;gap:10px}
.prog .back{width:28px;height:28px;display:grid;place-items:center;color:var(--dt2)}
.prog .back svg{width:16px;height:16px}
.prog .bar{flex:1;height:4px;border-radius:2px;background:var(--dk3)}.prog .bar i{display:block;height:100%;border-radius:2px;background:var(--y);transition:width .3s}
.prog .n{font-size:12px;color:var(--dt3);font-variant-numeric:tabular-nums}
.h1{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.33;white-space:pre-line}
.h1 .y{color:var(--y)}
.cap{font-size:13px;color:var(--dt3);margin-top:-10px}
.hero{background:var(--dk2);border-radius:20px;padding:18px;display:grid;gap:6px}
.hero .r1{display:flex;justify-content:space-between;align-items:baseline}
.hero .pct{font-size:46px;font-weight:900;letter-spacing:-.04em;color:var(--y);line-height:1.05;font-variant-numeric:tabular-nums}
.hero .won{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:6px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--dk3) 0 var(--p),var(--y) var(--p) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--dk3)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--dk3)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:0}
.eq{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--dln);font-size:14px;color:var(--dt2)}
.eq b{color:var(--dt);font-size:15px}
.seg{display:flex;background:var(--dk3);border-radius:9px;padding:2px}
.seg button{height:28px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:600;color:var(--dt3)}
.seg button[aria-pressed="true"]{background:var(--dk);color:var(--dt)}
.fact{display:flex;align-items:center;gap:10px;background:var(--dk2);border-radius:14px;padding:13px 14px;font-size:13.5px;color:var(--dt2)}
.fact::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dt3);flex:none}
.fact b{color:var(--dt)}.fact small{margin-left:auto;color:var(--dt3);font-size:12px}
.mini{display:flex;justify-content:space-between;font-size:13px;color:var(--dt3)}.mini b{color:var(--dt)}
.ch{display:grid;gap:8px}
.cb{height:54px;border-radius:14px;background:var(--dk2);border:1.5px solid transparent;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:15.5px;font-weight:600;text-align:left}
.cb[aria-pressed="true"]{border-color:var(--y);background:var(--ysoft)}
.cb .k{width:22px;height:22px;border-radius:50%;border:1.5px solid #3E453B;display:grid;place-items:center}
.cb[aria-pressed="true"] .k{background:var(--y);border-color:var(--y);color:var(--yi)}
.cb .k svg{width:11px;height:11px;opacity:0}.cb[aria-pressed="true"] .k svg{opacity:1}
textarea,.txt{width:100%;border-radius:14px;background:var(--dk2);border:1.5px solid var(--dln);color:var(--dt);font:inherit;font-size:15px;padding:14px;resize:none;outline:none}
textarea:focus,.txt:focus{border-color:var(--y)}
.lab{font-size:13px;color:var(--dt3);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cp{height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--dln);font-size:14px;font-weight:600;color:var(--dt2)}
.cp[aria-pressed="true"]{border-color:var(--y);color:var(--dt);background:var(--ysoft)}
.cta{margin-top:auto;display:grid;gap:8px;padding-top:6px}
.btn{height:54px;border-radius:15px;font-size:16.5px;font-weight:800}
.btn.y{background:var(--y);color:var(--yi)}.btn.y:disabled{opacity:.35;cursor:default}
.btn.g{background:var(--dk3);color:var(--dt)}
.lk{font-size:14px;color:var(--dt3);padding:6px;justify-self:center}
.ok-ic{width:52px;height:52px;border-radius:50%;background:var(--y);color:var(--yi);display:grid;place-items:center}.ok-ic svg{width:24px;height:24px}
.card{background:var(--dk2);border-radius:20px;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:flex-end;padding:16px 18px;border-bottom:1px solid var(--dln)}
.card-h .nm{font-size:12.5px;color:var(--dt3)}.card-h .pct{font-size:34px;font-weight:900;color:var(--y);letter-spacing:-.03em;line-height:1.1}
.card-h .r{text-align:right;font-size:13px;color:var(--dt2);line-height:1.5}
.kv{padding:4px 18px 8px}.kv div{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--dln);font-size:14px}.kv div:last-child{border:0}
.kv span{color:var(--dt3);font-size:13px}.kv b{font-weight:600;line-height:1.45}
/* E07 */
.sum{background:var(--dk2);border-radius:20px;padding:18px;display:grid;gap:10px}
.sum .o{font-size:13px;color:var(--dt3)}.sum .big{font-size:25px;font-weight:900;letter-spacing:-.03em}
.dots{display:flex;gap:6px}.dots i{width:30px;height:6px;border-radius:3px;background:var(--dk3)}.dots i.d{background:var(--dt2)}.dots i.o{background:var(--y)}
.qr{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--dln);font-size:14px;color:var(--dt2)}
.qr b{color:var(--dt)}
.qs{display:flex;align-items:center;gap:4px}.qs button{width:32px;height:32px;border-radius:9px;background:var(--dk3);font-size:17px;font-weight:700}.qs b{min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.rl{background:var(--dk2);border-radius:20px;overflow:hidden}
.ri{border-bottom:1px solid var(--dln)}.ri:last-child{border:0}
.ri-h{width:100%;display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:15px 16px;text-align:left}
.st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:900}
.st.diff{box-shadow:inset 0 0 0 1.5px var(--dt2);color:var(--dt)}.st.ok{background:var(--y);color:var(--yi)}.st.na{background:var(--dk3);color:var(--dt3)}
.ri-h .t{font-size:14.5px;font-weight:600;line-height:1.4}.ri.na .t{color:var(--dt3)}
.ri-h .m{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.ri-h .m.ok{color:var(--y)}.ri-h .m.na{color:var(--dt3);font-weight:500}
.ri-b{display:none;padding:0 16px 14px 50px;font-size:13px;color:var(--dt2);line-height:1.55}.ri.open .ri-b{display:grid;gap:4px}
.ri-b i{font-style:normal;font-weight:800;margin-right:6px}
.inner{position:absolute;left:0;right:0;bottom:0;z-index:3;background:var(--dk);border-top:1px solid var(--dln);border-radius:24px 24px 0 0;padding:20px 20px 26px;display:grid;gap:14px;animation:up .28s cubic-bezier(.2,.9,.3,1);box-shadow:0 -14px 30px rgba(0,0,0,.4)}
.inner h3{font-size:18px;font-weight:800}
.iscrim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:2}
.disc{font-size:11px;color:var(--dt3);text-align:center;padding:0 0 14px}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:#111;color:#fff;font-size:13px;font-weight:600;padding:10px 14px;border-radius:12px;z-index:30;white-space:nowrap;animation:fade .2s}
.note{font-size:12px;color:var(--sub);text-align:center;max-width:390px;line-height:1.5}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

 <div class="sb" id="sb"><span>9:41</span><span style="display:flex;gap:6px;align-items:center"><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg><svg viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/><rect x="23.5" y="4" width="1.8" height="4" rx=".9" fill="currentColor" opacity=".45"/></svg></span></div>

<script>
const $=s=>document.querySelector(s);
const won=n=>Math.round(n).toLocaleString('ko-KR');
const man=n=>{const v=Math.round(n/1000)/10;return (Number.isInteger(v)?v:v.toFixed(1))+'만 원'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CK='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m2.5 6.2 2.3 2.3 4.7-5"/></svg>';
const BACK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3 5 8l5 5"/></svg>';
const X='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="m2 2 8 8M10 2l-8 8"/></svg>';
const W='<span class="wl">W</span>';
const TOTAL=17769000,CASH=2150000;
let SC='e11';let timers=[];
const isl=$('#isl'),islC=$('#islC'),islE=$('#islE'),layer=$('#appLayer'),sb=$('#sb');
function island(state,c,e){isl.className='isl'+(state?' '+state:'');if(c!=null)islC.innerHTML=c;if(e!=null)islE.innerHTML=e;}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;$('#scr').appendChild(el);setTimeout(()=>el.remove(),2200);}
function clearT(){timers.forEach(clearTimeout);timers=[];}
function spark(up){const pts=[];let v=50;for(let i=0;i<40;i++){v+=Math.sin(i*1.3)*3+Math.cos(i*.7)*2+(up?(i>36?6:.3):(i<14?.6:i<24?-1.4:1));pts.push(v);}const mn=Math.min(...pts),mx=Math.max(...pts);return `<svg class="spark" viewBox="0 0 346 70" preserveAspectRatio="none"><polyline points="${pts.map((p,i)=>(i*346/39).toFixed(1)+','+(64-(p-mn)/(mx-mn)*58).toFixed(1)).join(' ')}" fill="none" stroke="#e8424d" stroke-width="2" stroke-linejoin="round"/></svg>`;}
function brokerHtml(o){return `<div class="app"><div class="nav">${BACK.replace('stroke-width="2"','stroke-width="2" width="22" height="22"')}<span>${o.nm}</span><svg viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.8"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></div>
 <div class="stk"><div class="nm">${o.nm}<span>${o.code}</span></div><div class="pr">${won(o.price)}원</div><div class="ch">${o.chg}</div></div>${spark(o.up)}
 ${o.hold?`<div class="hold">보유 <b>${o.hold}</b></div>`:''}
 <div class="ord"><div class="otab"><span class="on">구매</span><span>판매</span></div>
  <div class="or"><span class="k">가격 · 지정가</span><span class="v">${won(o.price)}원</span></div>
  <div class="or"><span class="k">수량</span><div class="stp"><button data-q="-1">−</button><b id="qty">${o.qty}주</b><button data-q="1">+</button></div></div>
  <div class="tot"><span class="k" style="color:#777;font-size:14px">주문 금액</span><span class="v" id="amt">${won(o.qty*o.price)}원</span></div>
  <div class="or"><span class="k">주문 가능</span><span class="v">${won(CASH)}원</span></div></div>
 <div id="chipSlot"></div><button class="buy" id="buy">구매하기</button></div>`;}

/* ================= E11 ================= */
const E11={qty:40,price:48500,step:0,loss:-20,basis:'save',act:null,deep:null,reason:'',period:null,saved:null};
const BASIS={save:['월 저축',500000],rent:['월세',650000],food:['식비',450000]};
const ACTS=[['hold','그래도 보유'],['half','절반 정리'],['all','전부 정리'],['why','산 이유부터 확인'],['dk','아직 모르겠어요']];
const an=k=>k==='same'?'처음 정한 대로':(ACTS.find(a=>a[0]===k)||[])[1];
const amt11=()=>E11.qty*E11.price,lw=p=>amt11()*Math.abs(p)/100;
const life=p=>{const [n,v]=BASIS[E11.basis];return [n,(lw(p)/v).toFixed(1)]};
const eps=x=>x>=-9?6:x>=-15?4:x>=-21?2:x>=-34?1:0;
const deep=()=>Math.max(-60,Math.round(E11.loss*1.75/5)*5);
function e11Broker(){layer.innerHTML=brokerHtml({nm:'누리반도체',code:'204310',price:E11.price,chg:'▲ 580 (+1.2%)',up:false,qty:E11.qty});
 bindQty(E11,()=>{$('#amt').textContent=won(amt11())+'원';});renderChip11();
 $('#buy').onclick=()=>toast('가상 주문이에요 · 실제로 주문되지 않아요');}
function renderChip11(){const s=$('#chipSlot');if(!s)return;s.innerHTML=E11.saved?`<div class="chip">${W}<span class="tx">내 기준 <i>${E11.saved.loss}%</i> · ${E11.saved.act}</span></div>`:'';}
function e11Start(){clearT();E11.step=0;e11Broker();island('');sb.classList.remove('dark');
 timers.push(setTimeout(()=>{if(E11.saved){island('compact',`${W}<span class="r">${E11.saved.loss}%</span>`);return;}
  island('exp',null,`<div class="h">${W} WHYSE · 누리반도체</div><div class="t">이 종목엔 아직 내 기준이 없어요<small>사기 전에 1분만 정해 볼까요?</small></div><div class="b"><button class="n" id="iLater">나중에</button><button class="y" id="iGo">정하기</button></div>`);
  $('#iLater').onclick=e=>{e.stopPropagation();island('compact',`${W}<span class="r">기준 없음</span>`);};
  $('#iGo').onclick=e=>{e.stopPropagation();openWS11();};},1100));
 isl.onclick=()=>{if(isl.classList.contains('compact'))openWS11();};}
function wsShell(title,sub,body){return `<div class="ws" id="ws"><div class="grab"></div><div class="ws-h">${W}<span>WHYSE</span><span class="sub">${sub}</span><button class="x" id="wsX" aria-label="닫기">${X}</button></div><div class="wb" id="wb">${body}</div><div class="disc">사거나 팔라고 하지 않아요 · 결정은 직접 해요</div></div>`;}
function openWS11(){island('compact',`${W}<span class="r">기준 세우는 중</span>`);let ws=$('#ws');if(!ws){layer.insertAdjacentHTML('beforeend',wsShell('', '사기 전에 기준 세우기',''));$('#wsX').onclick=closeWS11;}if(E11.saved)E11.step=4;render11();}
function closeWS11(){const ws=$('#ws');if(ws)ws.remove();island('compact',`${W}<span class="r">${E11.saved?E11.saved.loss+'%':'기준 없음'}</span>`);}
const prog=n=>`<div class="prog"><button class="back" data-go="${n-1}" ${n===0?'style="visibility:hidden"':''} aria-label="이전">${BACK}</button><div class="bar"><i style="width:${(n+1)*25}%"></i></div><span class="n">${n+1}/4</span></div>`;
const cb=(g,k,v,sel)=>`<button class="cb" data-pick="${g}" data-v="${k}" aria-pressed="${sel===k}">${v}<span class="k">${CK}</span></button>`;
function render11(){const b=$('#wb');const n=E11.step;let h='';
 if(n===0){const [ln,lv]=life(E11.loss);h=`${prog(0)}<h2 class="h1">얼마나 떨어지면\n버틸 수 있을까요?</h2>
  <div class="hero"><div class="r1"><span class="pct" id="pct">${E11.loss}%</span><span class="won" id="won">−${man(lw(E11.loss))}</span></div>
  <input type="range" id="loss" min="-50" max="-5" value="${E11.loss}" aria-label="하락 폭">
  <div class="eq"><span id="eq">= ${ln} <b>${lv}달치</b></span><div class="seg">${Object.entries(BASIS).map(([k,[nm]])=>`<button data-basis="${k}" aria-pressed="${E11.basis===k}">${nm}</button>`).join('')}</div></div></div>
  <div class="fact" id="fact"></div><div class="mini"><span>넣는 돈 · 주문 화면 기준</span><b>${man(amt11())}</b></div>
  <div class="cta"><button class="btn y" data-go="1">다음</button></div>`;}
 else if(n===1)h=`${prog(1)}<h2 class="h1"><span class="y">${E11.loss}%</span>가 되면\n어떻게 할까요?</h2><div class="ch">${ACTS.map(([k,v])=>cb('act',k,v,E11.act)).join('')}</div><div class="cta"><button class="btn y" data-go="2" ${E11.act?'':'disabled'}>다음</button></div>`;
 else if(n===2)h=`${prog(2)}<h2 class="h1"><span class="y">${deep()}%</span>까지 가면요?</h2><p class="cap">막상 그때는 더 버티게 되기 쉬워요</p><div class="ch">${cb('deep','same','처음 정한 대로',E11.deep)}${ACTS.filter(a=>a[0]!==E11.act).map(([k,v])=>cb('deep',k,v,E11.deep)).join('')}</div><div class="cta"><button class="btn y" data-go="3" ${E11.deep?'':'disabled'}>다음</button></div>`;
 else if(n===3)h=`${prog(3)}<h2 class="h1">왜 사나요?</h2><p class="cap">흔들릴 때 다시 보여 드릴게요</p><textarea id="why" rows="2" placeholder="예: 메모리 장비 수주가 늘고 있어서">${esc(E11.reason)}</textarea><span class="lab">보유 기간</span><div class="chips">${['3개월','1년','2년 이상','미정'].map(p=>`<button class="cp" data-pick="period" data-v="${p}" aria-pressed="${E11.period===p}">${p}</button>`).join('')}</div><div class="cta"><button class="btn y" id="save" ${E11.period?'':'disabled'}>기준 저장</button></div>`;
 else{const s=E11.saved;h=`<div class="ok-ic">${CK}</div><h2 class="h1">내 기준을 저장했어요</h2><div class="card"><div class="card-h"><div><div class="nm">누리반도체 · 내 기준</div><div class="pct">${s.loss}%</div></div><div class="r">−${man(s.lossWon)}<br>${s.life}</div></div><div class="kv"><div><span>그때</span><b>${s.act}</b></div><div><span>${s.deep}%면</span><b>${s.deepAct}</b></div><div><span>산 이유</span><b>${s.reason?esc(s.reason):'—'}</b></div><div><span>기간</span><b>${s.period}</b></div></div></div><p class="cap" style="margin:0">떨어질 때와 더 살 때 다시 꺼내 드려요</p><div class="cta"><button class="btn y" id="back">증권사로 돌아가기</button><button class="lk" data-go="0">다시 정하기</button></div>`;}
 b.innerHTML=h;b.scrollTop=0;bind11();}
function bind11(){const b=$('#wb');
 const r=$('#loss');if(r){const upd=()=>{const [ln,lv]=life(E11.loss);$('#pct').textContent=E11.loss+'%';$('#won').textContent='−'+man(lw(E11.loss));$('#eq').innerHTML=`= ${ln} <b>${lv}달치</b>`;const e=eps(E11.loss);$('#fact').innerHTML=(e?`지난 1년, 이만큼 <b>${e}번</b> 빠졌어요`:'지난 1년엔 이만큼 빠진 적 없어요')+'<small>최대 −34%</small>';r.style.setProperty('--p',((E11.loss+50)/45*100)+'%');};upd();
  r.oninput=e=>{E11.loss=+e.target.value;upd();};
  b.querySelectorAll('[data-basis]').forEach(x=>x.onclick=()=>{E11.basis=x.dataset.basis;b.querySelectorAll('[data-basis]').forEach(y=>y.setAttribute('aria-pressed',y===x));upd();});}
 b.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>{const g=x.dataset.pick;E11[g]=x.dataset.v;b.querySelectorAll(`[data-pick="${g}"]`).forEach(y=>y.setAttribute('aria-pressed',y===x));const c=b.querySelector('.cta .btn');if(c)c.disabled=false;});
 b.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{if(x.disabled)return;E11.step=+x.dataset.go;if(E11.step===0&&E11.saved){E11.saved=null;renderChip11();}render11();});
 const w=$('#why');if(w)w.oninput=e=>E11.reason=e.target.value;
 const s=$('#save');if(s)s.onclick=()=>{const [ln,lv]=life(E11.loss);E11.saved={loss:E11.loss,lossWon:lw(E11.loss),life:`${ln} ${lv}달치`,act:an(E11.act),deep:deep(),deepAct:an(E11.deep),reason:E11.reason.trim(),period:E11.period};E11.step=4;renderChip11();render11();};
 const bk=$('#back');if(bk)bk.onclick=closeWS11;}

/* ================= E07 ================= */
const E07={qty:78,price:25370,held:300,avg:21500,day:9.8,r:{hot:5,split:3,cap:40},open:{},logged:false,note:null};
const amt7=()=>E07.qty*E07.price,ev7=()=>E07.held*E07.price,wNow=()=>ev7()/TOTAL*100,wAfter=()=>(ev7()+amt7())/TOTAL*100,cap7=()=>CASH/E07.r.split;

 b.querySelectorAll('[data-q2]').forEach(x=>x.onclick=()=>{E07.qty=Math.max(1,Math.min(Math.floor(CASH/E07.price),E07.qty+ +x.dataset.q2));$('#qty').textContent=E07.qty+'주';$('#amt').textContent=won(amt7())+'원';const s=$('#bs2');if(s)s.querySelectorAll('.or .v')[0].textContent=E07.qty+'주',s.querySelectorAll('.or .v')[1].textContent=won(amt7())+'원';render07();});

function bindQty(S,cb){document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{S.qty=Math.max(1,Math.min(Math.floor(CASH/S.price),S.qty+ +b.dataset.q));$('#qty').textContent=S.qty+'주';cb();});}

addEventListener('resize',fit);fit();go('e11');

})();
